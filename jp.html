<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình tiếng Nhật 12 tuần – 日本語八十四日</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="assets/profile.js"></script>
<script>LP.require()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EE; --surface:#FFFFFF; --sunk:#E9EBE4; --ink:#1D2230; --muted:#5B6274;
  --ai:#27407A; --ai-soft:#E3E8F3; --line:#D6D9DF; --shu:#BF3A2B; --shu-soft:#F6E2DE;
  --matcha:#5F7F32; --matcha-soft:#E7EEDB; --focus:#27407A;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11141B; --surface:#191E28; --sunk:#141821; --ink:#E7E5DF; --muted:#9BA2B2;
    --ai:#93ABE2; --ai-soft:#222C42; --line:#2C3443; --shu:#E2614F; --shu-soft:#3A2322;
    --matcha:#A3C06E; --matcha-soft:#26301C; --focus:#93ABE2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141B; --surface:#191E28; --sunk:#141821; --ink:#E7E5DF; --muted:#9BA2B2;
  --ai:#93ABE2; --ai-soft:#222C42; --line:#2C3443; --shu:#E2614F; --shu-soft:#3A2322;
  --matcha:#A3C06E; --matcha-soft:#26301C; --focus:#93ABE2; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.jp{font-family:var(--jp)}
rt{font-size:.55em;font-family:var(--ui);color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 0 18px;border-bottom:1px solid var(--line)}
.title{margin:0;font:700 clamp(28px,4.4vw,44px)/1.1 var(--jp);letter-spacing:.04em}
.title small{display:block;font:500 15px/1.4 var(--ui);letter-spacing:0;color:var(--muted);margin-top:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--ai)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--surface)}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
a.btn:hover{color:var(--ai)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai)}

/* stats */
.stats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px;padding:18px 0 22px;align-items:end}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font:600 22px/1.2 var(--ui)}
.stat .val span{font-size:14px;font-weight:500;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--shu);width:0;transition:width .4s}

/* grid */
.cal{display:grid;grid-template-columns:150px repeat(7,1fr);gap:6px;margin-bottom:28px}
.wk{padding:8px 10px 8px 0;border-top:2px solid var(--ink);font-size:13px;color:var(--muted);line-height:1.35}
.wk b{display:block;color:var(--ink);font-size:14px}
.wk .jp{font-size:12px}
.day{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 8px 10px;cursor:pointer;min-height:86px;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.day:hover{border-color:var(--ai)}
.day .n{font:600 15px/1 var(--ui)}
.day .d{font-size:11px;color:var(--muted);margin-left:4px;font-weight:400}
.day .sk{font:600 12px/1.35 var(--jp);margin-top:3px}
.day .dm{font-size:11px;color:var(--muted);line-height:1.3}
.day.sun{background:var(--sunk)}
.day .pg{position:absolute;left:0;bottom:0;height:4px;background:var(--matcha);width:0}
.day.today{box-shadow:inset 0 0 0 2px var(--ai)}
.day.sel{border-color:var(--ink);border-width:2px;padding:6px 7px 9px}
.day.done{background:var(--shu-soft)}
.day.done::after{content:"済";position:absolute;right:6px;bottom:6px;width:30px;height:30px;border:2px solid var(--shu);color:var(--shu);border-radius:50%;font:700 15px/26px var(--jp);text-align:center;transform:rotate(-14deg);opacity:.9}
.day.done .pg{display:none}

/* detail */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px clamp(16px,4vw,40px) 36px;margin-bottom:48px}
.dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:8px}
.dh .meta{font-size:14px;color:var(--muted)}
.dh h2{margin:4px 0 2px;font:700 clamp(24px,3.4vw,32px)/1.25 var(--jp)}
.dh .vi{font-size:16px}
.dom{display:inline-block;margin-top:8px;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:var(--sunk)}
.nav{display:flex;gap:6px}
.task{padding:22px 0 6px;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.th{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.th .no{font:700 15px/1 var(--ui);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink);flex:none}
.th h3{margin:0;font-size:18px;font-weight:600;flex:1}
.th h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none;border:1px solid var(--line);padding:5px 10px;border-radius:20px;background:var(--surface)}
.chk input{width:18px;height:18px;accent-color:var(--shu);margin:0}
.task.ok .no{background:var(--shu);border-color:var(--shu);color:var(--surface)}
.task.ok .chk{border-color:var(--shu);color:var(--shu)}
.sent{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;padding:10px 0;border-top:1px dashed var(--line)}
.sent:first-of-type{border-top:0}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.play:hover{border-color:var(--ai);color:var(--ai)}
.play svg{width:14px;height:14px;fill:currentColor}
.sent .ja{font:500 19px/2 var(--jp)}
.sent .tr{font-size:14px;color:var(--muted);grid-column:2}
.sent .bad{grid-column:2;font-size:14px;margin-top:2px}
.bad s{color:var(--shu);text-decoration-thickness:1px}
.bad em{font-style:normal;color:var(--muted)}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.terms{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 6px}
.terms caption{text-align:left;font-weight:600;padding:6px 0;font-size:14px}
.terms td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.terms td:first-child{font:600 16px/1.5 var(--jp);white-space:nowrap}
.terms td:nth-child(2){color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
.gram h4{margin:0 0 6px;font:600 18px/1.5 var(--jp)}
.gram p{margin:0 0 10px;max-width:72ch}
.ex{display:flex;gap:10px;align-items:center;margin:6px 0}
.ex .ja{font:500 17px/1.8 var(--jp)}
.hint{max-width:72ch;margin:0 0 10px}
.steps{margin:6px 0 10px;padding-left:20px;font-size:14px;color:var(--muted);max-width:72ch}
.scene{background:var(--sunk);border-left:3px solid var(--ai);padding:12px 16px;border-radius:0 6px 6px 0;font-size:15px;margin-bottom:12px}
.scene dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px}
.scene dt{color:var(--muted);font-size:13px;padding-top:2px}
.scene dd{margin:0;font-family:var(--jp)}
details.prompt{margin:8px 0}
details.prompt summary{cursor:pointer;font-size:14px;color:var(--ai)}
details.prompt pre{white-space:pre-wrap;font:14px/1.7 var(--jp);background:var(--sunk);padding:12px;border-radius:6px;max-height:340px;overflow:auto;margin:8px 0 0}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;margin:8px 0}
.field input[type=number]{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:15px/1.6 var(--jp);resize:vertical}
.timer{font:600 20px/1 var(--ui);font-variant-numeric:tabular-nums;min-width:66px}
.timer.end{color:var(--shu)}
.wkrev .wd{margin:16px 0 4px;font-weight:600;font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--ai-soft);color:var(--ai);margin-left:6px;vertical-align:middle}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:22px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,12,18,.45)}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-size:14px;margin:10px 0 4px;color:var(--muted)}
dialog input,dialog select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.dlgbtns{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:13px;color:var(--muted);padding:0 0 40px}

@media (max-width:820px){
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:first-child{grid-column:1/-1}
  .cal{grid-template-columns:repeat(7,1fr);gap:4px}
  .wk{grid-column:1/-1;padding:10px 0 2px;border-top-width:1px}
  .wk b{display:inline;margin-right:6px}
  .day{min-height:58px;padding:5px 5px 8px}
  .day.sel{padding:4px 4px 7px}
  .day .sk{display:none}
  .day .d{display:block;margin:2px 0 0}
  .day .dm{font-size:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .day.done::after{width:22px;height:22px;font-size:11px;line-height:18px;right:3px;bottom:3px}
}
@media (max-width:480px){
  .wrap{padding:0 12px}
  .day .dm{display:none}
  .sent{grid-template-columns:34px 1fr;gap:2px 10px}
  .sent .ja{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="title">日本語・八十四日<small id="sub">Lộ trình tiếng Nhật 12 tuần · kaiwa IT, BJT, JLPT N1, phỏng vấn chuyển việc</small></h1>
    <div class="tools">
      <button class="btn primary" id="todayBtn">Bài hôm nay</button>
      <button class="btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối">Sáng/tối</button>
      <button class="btn" id="setBtn">Cài đặt</button>
    </div>
  </header>

  <section class="stats" aria-label="Tiến độ">
    <div class="stat"><div class="lbl" id="dayLbl">Ngày đã xong</div><div class="val" id="sDays">0 <span>/ 84</span></div><div class="bar"><i id="sBar"></i></div></div>
    <div class="stat"><div class="lbl">Điểm kaiwa trung bình</div><div class="val" id="sRp">–</div></div>
    <div class="stat"><div class="lbl">Tỉ lệ đúng N1</div><div class="val" id="sN1">–</div></div>
  </section>

  <nav class="cal" id="cal" aria-label="Lịch 12 tuần"></nav>
  <article class="detail" id="detail" aria-live="polite"></article>
  <p class="foot">Tiến độ được lưu trong trình duyệt này, trên thiết bị này. Đổi ngày bắt đầu trong Cài đặt nếu bạn bắt đầu muộn hơn.</p>
</div>

<dialog id="dlg">
  <h3>Cài đặt</h3>
  <label for="fStart">Ngày bắt đầu (Ngày 1)</label>
  <input type="date" id="fStart">
  <label for="fBjt">Mục tiêu BJT</label>
  <input type="text" id="fBjt" placeholder="J1">
  <label for="fJlpt">Kỳ thi JLPT N1</label>
  <input type="text" id="fJlpt" placeholder="tháng 7/2027">
  <label for="fRate">Tốc độ đọc mẫu câu</label>
  <select id="fRate"><option value="0.85">Chậm (0.85)</option><option value="1">Bình thường (1.0)</option><option value="1.15">Nhanh như hội thoại thật (1.15)</option></select>
  <div class="dlgbtns">
    <button class="btn" id="resetBtn">Xoá toàn bộ tiến độ</button>
    <span><button class="btn" id="cancelBtn">Đóng</button> <button class="btn primary" id="saveBtn">Lưu</button></span>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const DOM = {
edu:{n:"教育・保育",v:"Giáo dục – nhà trẻ/mẫu giáo",t:["園児|えんじ|trẻ đang theo học","入園・退園|にゅうえん・たいえん|nhập học / thôi học","認定区分|にんていくぶん|phân loại chứng nhận (1・2・3号)","保育必要量|ほいくひつようりょう|lượng giữ trẻ cần thiết (標準時間/短時間)","給付費|きゅうふひ|tiền trợ cấp cơ sở","加算|かさん|khoản cộng thêm vào trợ cấp","延長保育|えんちょうほいく|giữ trẻ ngoài giờ","登降園管理|とうこうえんかんり|quản lý đưa đón","職員配置基準|しょくいんはいちきじゅん|chuẩn bố trí giáo viên/nhân viên","実績報告|じっせきほうこく|báo cáo kết quả thực tế","在籍判定|ざいせきはんてい|xác định trẻ còn đang học","指導計画|しどうけいかく|kế hoạch giáo dục/giữ trẻ"]},
fin:{n:"金融・銀行",v:"Tài chính – ngân hàng",t:["口座開設|こうざかいせつ|mở tài khoản","本人確認|ほんにんかくにん|xác minh danh tính (eKYC)","振込|ふりこみ|chuyển khoản","勘定系|かんじょうけい|hệ thống core banking","与信|よしん|cấp tín dụng, thẩm định tín dụng","審査|しんさ|thẩm định","融資|ゆうし|cho vay","残高照会|ざんだかしょうかい|tra cứu số dư","全銀フォーマット|ぜんぎんフォーマット|định dạng chuyển khoản liên ngân hàng Zengin","反社チェック|はんしゃチェック|kiểm tra tổ chức phản xã hội","マネロン対策|マネロンたいさく|phòng chống rửa tiền (AML)","締め処理|しめしょり|xử lý chốt cuối ngày/kỳ"]},
ins:{n:"保険",v:"Bảo hiểm",t:["契約管理|けいやくかんり|quản lý hợp đồng","保険金請求|ほけんきんせいきゅう|yêu cầu chi trả bảo hiểm","被保険者|ひほけんしゃ|người được bảo hiểm","契約者|けいやくしゃ|bên mua bảo hiểm","特約|とくやく|điều khoản bổ sung (rider)","査定|さてい|thẩm định chi trả","約款|やっかん|quy tắc, điều khoản chung","引受|ひきうけ|thẩm định nhận bảo hiểm (underwriting)","解約返戻金|かいやくへんれいきん|tiền hoàn lại khi hủy hợp đồng","満期|まんき|đáo hạn","代理店|だいりてん|đại lý","保全|ほぜん|nghiệp vụ duy trì hợp đồng (đổi thông tin, đổi điều khoản)"]},
ec:{n:"EC・小売",v:"Thương mại điện tử – bán lẻ",t:["受注|じゅちゅう|nhận đơn hàng","在庫引当|ざいこひきあて|giữ/phân bổ tồn kho cho đơn","決済|けっさい|thanh toán","オーソリ|オーソリ|cấp phép thanh toán thẻ (authorization)","返品|へんぴん|trả hàng","欠品|けっぴん|hết hàng, thiếu hàng","POS|ポス|máy tính tiền tại cửa hàng","売上計上|うりあげけいじょう|ghi nhận doanh thu","販促|はんそく|khuyến mãi, xúc tiến bán hàng","出荷指示|しゅっかしじ|lệnh xuất hàng","予約販売|よやくはんばい|bán đặt trước","会員ランク|かいいんランク|hạng thành viên"]},

{sk:"悪い報告は早く",vi:"Báo tin xấu sớm và đúng cách",dom:"ec",
g:["「〜させていただく」の正誤と悪い報告","させていただく chỉ tự nhiên khi (1) có sự cho phép/ân huệ của đối phương và (2) mình được lợi. 「説明させていただきます」 ở mức chấp nhận được, nhưng 「担当させていただいております」 dùng dày quá sẽ nặng nề. Báo tin xấu: 「〜という事態が発生しております」 (sự thật) → 「現時点で〜」 (phạm vi) → 「取り急ぎ第一報として」.",["受注取込で遅延が発生しております。","取り急ぎ第一報としてお伝えいたします。"]],
s:[["申し訳ございません、一点ご報告がございます。受注取込のバッチで遅延が発生しております。","Xin lỗi, có một việc cần báo: batch nhập đơn hàng đang bị trễ."],
["現時点で影響が出ているのは、昨夜23時以降の注文約300件です。","Hiện tại bị ảnh hưởng là khoảng 300 đơn từ 23h đêm qua."],
["原因はまだ調査中ですが、取り急ぎ{第一報|だいいっぽう}としてお伝えしました。","Nguyên nhân còn đang điều tra, nhưng tôi báo ngay bản tin đầu tiên."],
["本来もっと早くご相談すべきところ、判断が遅れてしまい申し訳ございません。","Lẽ ra phải trao đổi sớm hơn, tôi xin lỗi vì đã chậm trong phán đoán.","報告が遅れてごめんなさい。"],
["お客様への影響を最小限に{抑|おさ}えるため、手動での取込を並行して進めております。","Để giảm thiểu ảnh hưởng tới khách, chúng tôi đang song song nhập tay."],
["次回は12時までに、原因と今後の見通しをご報告いたします。","Trước 12h tôi sẽ báo nguyên nhân và hướng xử lý tiếp theo."]],
ls:["悪い報告 上司 伝え方","Nghe cách báo tin xấu cho cấp trên. Shadowing đoạn mở đầu báo cáo: câu xin lỗi + sự thật + phạm vi."],
rp:["上司（自社の部長、厳しめ、数字に細かい）","EC受注システム保守チームのBA","朝、受注取込バッチが止まっていたことに気づいた。夜間の注文約300件が未取込。","部長が「なんで昨夜のアラートで気づかなかったの？」「お客様（ECの事業部）にはいつ言うつもり？」と詰める。","事実・影響・対応・次回報告時刻をぶれずに伝える。"],
n1:"文字・語彙｜用法（誤用を見抜く）8・言い換え類義 7"},

{sk:"相談の型",vi:"Xin ý kiến kèm phương án",dom:"log",
g:["相談は「選択肢＋自分の意見」で","Đi xin ý kiến người Nhật nên mang sẵn 2–3 phương án và đề xuất của mình: 「A案とB案がございまして、私としてはB案が妥当かと存じます」. 「〜かと存じます」「〜てもよろしいでしょうか」 làm mềm ý kiến mà vẫn rõ ràng. 「教えてください」 với người trên → 「ご教示いただけますと幸いです」.",["私としてはB案が妥当かと存じます。","他に観点がございましたら、ご教示いただけますと助かります。"]],
s:[["配車ロジックの件で、ご相談させてください。","Cho tôi xin ý kiến về logic điều xe.","ちょっと聞きたいことがあります。"],
["対応案を2つ考えておりまして、A案は{即効性|そっこうせい}があり、B案は{抜本的|ばっぽんてき}な解決になります。","Tôi có 2 phương án: A có hiệu quả ngay, B giải quyết tận gốc."],
["私としてはB案が{妥当|だとう}かと存じますが、工数の面でご判断いただきたく。","Theo tôi B hợp lý, nhưng về mặt công số tôi xin anh quyết định."],
["A案ですと、{繁忙期|はんぼうき}に再発する懸念が残ります。","Nếu chọn A, vẫn còn lo ngại tái phát vào mùa cao điểm."],
["もし他に{観点|かんてん}がございましたら、ご{教示|きょうじ}いただけますと助かります。","Nếu có góc nhìn nào khác, mong anh chỉ giáo.","教えてください。"],
["では、B案で進める方向で、本日中に関係者へ展開いたします。","Vậy tôi sẽ đi theo hướng B và thông báo cho các bên trong hôm nay."]],
ls:["上司に相談 仕方 選択肢","Nghe cách 相談 với sếp. Tìm thêm 「物流 配車 2024年問題 NHK」 để quen từ vựng ngành."],
rp:["上司（自社の課長、穏やかだが判断は慎重）","配送管理システム改修のBA","配車の自動割当で、繁忙期に積載率が下がる問題が見つかった。A案（パラメータ調整）とB案（ロジック改修）を持って相談に行く。","課長が「C案として、運用で回避できないの？」と第三の案を出し、「お客様の予算はもう残ってないよ」と付け加える。","選択肢と自分の意見を示し、上司の案も踏まえて結論を出す。"],
n1:"文字・語彙｜文脈規定（慣用句・複合動詞）10・漢字読み 5"},

{sk:"面接①：自己紹介・職務経歴",vi:"Phỏng vấn: tự giới thiệu, tóm tắt kinh nghiệm",dom:"job",
g:["経歴を語る N1 表現：〜に携わる・〜を経て・〜を通じて","「〜に携わってまいりました」 (đã tham gia vào), 「〜を経て」 (trải qua), 「〜を通じて」 (thông qua) giúp phần kinh nghiệm gọn và trang trọng. Chuẩn bị 3 bản: 30 giây, 1 phút, 3 phút; kết bằng 「以上が経歴の概要です」 chứ không chỉ 「以上です」.",["約7年間、ブリッジ兼BAとして要件定義に携わってまいりました。","開発担当を経て、現在はBAとして上流工程を担当しております。"]],
s:[["グエンと申します。本日はこのような機会をいただき、ありがとうございます。","Tôi là Nguyễn. Cảm ơn quý công ty đã cho tôi cơ hội hôm nay."],
["これまで約7年間、日系企業向けのシステム開発に、ブリッジ兼BAとして{携|たずさ}わってまいりました。","Khoảng 7 năm qua, tôi tham gia phát triển hệ thống cho doanh nghiệp Nhật với vai trò bridge kiêm BA."],
["直近では、保育施設向け業務システムの要件定義から受入テストまでを{一貫|いっかん}して担当しております。","Gần đây tôi phụ trách xuyên suốt từ định nghĩa yêu cầu đến kiểm thử nghiệm thu của hệ thống cho cơ sở giữ trẻ."],
["特に、お客様の{曖昧|あいまい}な要望を仕様に落とし込む工程を得意としております。","Tôi đặc biệt mạnh ở khâu biến yêu cầu mơ hồ của khách thành spec."],
["日本のお客様と直接やりとりする中で、{行間|ぎょうかん}を読む力が{鍛|きた}えられたと感じております。","Qua việc làm trực tiếp với khách Nhật, tôi thấy khả năng đọc ý ngoài lời của mình được rèn luyện."],
["簡単ではございますが、以上が経歴の概要です。","Đó là phần tóm tắt kinh nghiệm của tôi.","以上です。"]],
ls:["転職面接 自己紹介 1分 例","Nghe các mẫu tự giới thiệu 1 phút trong phỏng vấn chuyển việc. Shadowing nhịp nói, chỗ ngắt và cách kết."],
rp:["面接官（IT企業の人事＋開発部マネージャー、一次面接）","転職希望のBA（応募職種：BA／ITコンサルタント）","オンライン一次面接の冒頭。自己紹介と職務経歴の説明を求められる。","面接官が「すみません、時間が押しているので30秒でお願いできますか」と短縮を求め、その後「ブリッジとBAの違いは？」と深掘りする。","30秒版と3分版を即座に切り替えて話す。"],
n1:"文字・語彙｜ミックス（ビジネス・抽象語）15"},

{sk:"クッション言葉と婉曲表現",vi:"Từ đệm và cách nói vòng",dom:"mfg",
g:["クッション言葉の使い分け","恐れ入りますが (nhờ vả chung), お手数をおかけしますが (khi bắt người khác tốn công), あいにく (báo điều không mong muốn), 差し支えなければ (hỏi thông tin riêng/nhạy cảm), 勝手を申しまして恐縮ですが (khi yêu cầu theo ý mình). Kết câu nhờ vả bằng 「〜いただけますでしょうか」「〜いただけますと幸いです」 thay vì mệnh lệnh.",["お手数をおかけしますが、ご確認いただけますと幸いです。","勝手を申しまして恐縮ですが、金曜までにいただけると助かります。"]],
s:[["お忙しいところ恐れ入りますが、BOMの最新版をご共有いただけますでしょうか。","Xin lỗi làm phiền lúc bận, anh/chị có thể chia sẻ bản BOM mới nhất được không ạ.","BOMの最新版を送ってください。"],
["お{手数|てすう}をおかけしますが、工程ごとの標準時間もあわせてご確認いただけますと幸いです。","Phiền anh/chị kiểm tra luôn thời gian tiêu chuẩn của từng công đoạn."],
["差し{支|つか}えなければ、現在の運用でお困りの点を伺えますか。","Nếu không phiền, cho tôi hỏi những điểm đang gặp khó trong vận hành hiện tại."],
["勝手を申しまして{恐縮|きょうしゅく}ですが、金曜までにいただけると大変助かります。","Xin lỗi vì yêu cầu theo ý mình, nhưng nếu nhận được trước thứ Sáu thì rất tốt."],
["難しいようでしたら、一部だけでも先にいただくことは可能でしょうか。","Nếu khó, có thể gửi trước một phần được không ạ."],
["承知いたしました。では、来週火曜を{目処|めど}にお待ちしております。","Tôi hiểu rồi. Vậy tôi sẽ chờ, lấy mốc là thứ Ba tuần sau."]],
ls:["クッション言葉 ビジネス 一覧","Nghe giải thích các từ đệm. Sau đó tìm 「生産管理 システム 導入 事例」 để nghe từ vựng ngành sản xuất."],
rp:["顧客（部品メーカーの生産管理課・係長、現場出身で多忙）","生産管理システム導入のBA","要件定義に必要な資料（BOM、工程表、標準時間）を依頼する。","係長が「今週は月末で無理ですね。そもそも全部必要なんですか？」と返し、別の担当者に振ろうとする。","相手の負担に配慮しつつ、期限と最低限の範囲を合意する。"],
n1:"文字・語彙｜カタカナ語・副詞・オノマトペ 15"},

{sk:"電話対応",vi:"Nghe/gọi điện, chuyển máy, nhắn lại",dom:"med",
g:["電話の定型と聞き返し","Nghe không rõ: 「お電話が少々遠いようなのですが」 (không nói 「聞こえません」). Xác nhận: 「念のため復唱いたします」. Người cần gặp vắng: 「あいにく〜は席を外しております／会議中でございます」 + thời gian quay lại + đề nghị 折り返し. Khi khách giận: xin lỗi về sự bất tiện trước, chưa nhận lỗi về nguyên nhân khi chưa rõ.",["念のため復唱いたします。","戻り次第、折り返しご連絡いたします。"]],
s:[["お電話ありがとうございます。〇〇システムサポートのグエンでございます。","Cảm ơn quý khách đã gọi, tôi là Nguyễn ở bộ phận hỗ trợ hệ thống ○○."],
["大変ご不便をおかけしており、申し訳ございません。","Thành thật xin lỗi vì đã gây bất tiện."],
["恐れ入ります、お電話が少々遠いようなのですが…。","Xin lỗi, hình như đường dây hơi khó nghe ạ…","聞こえません。"],
["念のため{復唱|ふくしょう}いたします。本日9時以降、予約画面が表示されない、ということでよろしいでしょうか。","Tôi xin nhắc lại: từ 9h hôm nay màn hình đặt lịch không hiển thị, đúng không ạ."],
["あいにく担当の鈴木は会議中でございまして、10分ほどで戻る予定です。","Rất tiếc người phụ trách Suzuki đang họp, khoảng 10 phút nữa sẽ quay lại."],
["お急ぎの件と{承知|しょうち}しておりますので、私の方で先に状況を確認し、折り返しご連絡いたします。","Tôi hiểu việc này gấp, nên tôi sẽ kiểm tra tình hình trước rồi gọi lại."]],
ls:["電話応対 クレーム 例文 ロールプレイ","Nghe mẫu nghe điện thoại khi khách phàn nàn. Shadowing phần mở đầu và phần 復唱."],
rp:["顧客（クリニックの事務長、開院直後でかなり苛立っている）","予約管理システムのサポート担当兼BA","朝9時過ぎ、クリニックから「予約画面が出ない」と電話。担当の鈴木は会議中。","事務長が「患者さんが待合室にあふれてるんです！今すぐ何とかして！」と声を荒らげ、途中で電話が聞き取りにくくなる。","落ち着いて事実を確認し、具体的な次のアクションと時刻を約束する。"],
n1:"文法｜文法形式の判断（〜をもって・〜にあって・〜をおいて 等）15"},

{sk:"メール：依頼・催促",vi:"Email nhờ vả, nhắc việc",dom:"acc",
g:["催促メールの婉曲表現","Nhắc nhở mà không làm mất mặt: 「その後いかがでしょうか」, 「行き違いでご対応いただいておりましたらご容赦ください」, đưa lý do khách quan (月次決算の都合上). Tiêu đề rõ: 【ご確認のお願い】+ nội dung + kỳ hạn. Nói chuyện email bằng miệng (khi gọi điện hỏi) cũng dùng các mẫu này.",["その後いかがでしょうか。","行き違いでしたら、ご容赦ください。"]],
s:[["【ご確認のお願い】11月分請求書の金額について","[Nhờ kiểm tra] Về số tiền trên hóa đơn tháng 11"],
["先日お送りした請求書の件、その後いかがでしょうか。","Về hóa đơn gửi hôm trước, tình hình thế nào rồi ạ.","まだ返事が来ていませんが、どうなっていますか。"],
["{行|ゆ}き違いでご対応いただいておりましたら、ご{容赦|ようしゃ}ください。","Nếu thư này gửi trong lúc anh/chị đã xử lý rồi thì xin bỏ qua cho."],
["月次決算の都合上、恐縮ですが今週金曜までにご確認いただけますと幸いです。","Vì lịch quyết toán tháng, xin lỗi nhưng mong anh/chị kiểm tra trước thứ Sáu tuần này."],
["念のため、前回のメールを下記に転送いたします。","Để tiện, tôi chuyển tiếp email lần trước ở dưới."],
["迷惑メールフォルダに入っている可能性もございますので、お手数ですがご確認いただけますでしょうか。","Có thể thư đã vào mục thư rác, phiền anh/chị kiểm tra giúp."]],
ls:["催促メール 書き方 ビジネス","Nghe hướng dẫn viết email nhắc việc. Đọc to lại các mẫu câu trong video theo tốc độ người nói."],
rp:["顧客（中堅企業の経理担当、几帳面だが自分のミスは認めたがらない）","経費精算システム導入のBA","請求書・経費データの移行確認を2回メールで依頼したが返事がない。月次決算の締めが迫っているので電話で催促する。","担当者が「そんなメール届いてませんけど」と言い、さらに「そもそも確認ってこちらの作業なんですか？」と押し返す。","相手を責めずに、確認の必要性と期限を納得してもらう。"],
n1:"文法｜文法形式の判断（〜ともなると・〜ならでは・〜までもない 等）15"},

{sk:"チャット対応と温度感",vi:"Chat công việc: ngắn, đúng mức độ gấp",dom:"saas",
g:["チャットの距離感と「温度感」","Chat nội bộ ngắn hơn email nhưng vẫn giữ lễ: mở bằng 「お疲れさまです」, nêu mục đích ngay, ghi hạn và lý do. 「温度感」 = mức độ gấp/quan trọng. Với sếp và người ngoài team: 「承知しました」; với đồng nghiệp ngang hàng 「了解です」 thường được chấp nhận, nhưng một số công ty coi là thất lễ với người trên.",["取り急ぎ現状共有です。","温度感としては、今日中ならOK、明日だと厳しいです。"]],
s:[["田中さん、お疲れさまです。認証APIの件、一点だけ確認させてください。","Anh Tanaka, vất vả rồi. Về API xác thực, cho em hỏi một điểm."],
["取り急ぎ現状共有です。詳細は{追|お}って連絡します。","Chia sẻ nhanh tình hình trước, chi tiết sẽ báo sau."],
["本日17時のリリースに影響するため、16時までにご回答いただけると助かります。","Vì ảnh hưởng đến bản phát hành 17h hôm nay, nếu anh trả lời trước 16h thì tốt quá."],
["{温度感|おんどかん}としては、今日中ならOK、明日だと厳しいです。","Về mức độ gấp: trong hôm nay thì ổn, sang mai là khó."],
["承知しました。ご対応ありがとうございます。","Em hiểu rồi, cảm ơn anh đã xử lý.","了解しました！（上司・社外に）"],
["込み入った話になりそうなので、5分だけハドルでお話しできますか。","Có vẻ chuyện khá rắc rối, mình nói chuyện huddle 5 phút được không ạ."]],

{sk:"社内での依頼と断り",vi:"Từ chối, thương lượng việc trong nội bộ",dom:"hr",
g:["N1：〜かねる・〜かねない・〜ざるを得ない","〜かねる: không thể (lịch sự, dùng để từ chối: 「お引き受けいたしかねます」). 〜かねない: có nguy cơ xảy ra điều xấu (「品質低下を招きかねない」). 〜ざるを得ない: buộc phải. Kết hợp với lời cảm ơn và phương án thay thế để lời từ chối không cứng.",["この条件では、品質を担保しかねます。","このままでは納期に影響しかねません。"]],
s:[["お声がけいただきありがとうございます。ただ、正直なところ今週は{手一杯|ていっぱい}でして…。","Cảm ơn anh đã nghĩ tới em. Nhưng thật lòng tuần này em đã kín việc…"],
["今の案件の納期を考えると、全部をお引き受けするのは難しいかと思います。","Xét deadline dự án hiện tại, nhận toàn bộ thì e là khó."],
["勤怠の集計部分だけでしたら、来週水曜から{着手|ちゃくしゅ}できます。","Nếu chỉ phần tổng hợp chấm công thì từ thứ Tư tuần sau em bắt tay được."],
["どちらを優先すべきか、課長にもご判断いただいた方がよいかと思うのですが、いかがでしょうか。","Nên ưu tiên việc nào, em nghĩ nên để trưởng phòng quyết, anh thấy sao?"],
["この条件ですと、品質を{担保|たんぽ}しかねますので…。","Với điều kiện này, em khó đảm bảo chất lượng…","できません。"],
["今回は力になれず申し訳ないです。また余裕がある時にぜひ。","Lần này không giúp được, xin lỗi anh. Lần sau rảnh em nhất định hỗ trợ."]],
ls:["上手な断り方 職場 先輩","Nghe cách từ chối khéo trong công ty. Shadowing các câu mở đầu bằng lời cảm ơn."],

{sk:"面接②：転職理由・志望動機",vi:"Phỏng vấn: lý do chuyển việc, động cơ ứng tuyển",dom:"job",
g:["御社／貴社と N1：〜を機に・〜べく","Nói thì dùng 御社, viết (CV, email) dùng 貴社. Lý do chuyển việc nên nói theo hướng tích cực (muốn thử thách gì) chứ không chê công ty cũ. 「〜を機に」 (nhân dịp), 「〜べく」 (để mà, trang trọng) giúp câu chuyện có mạch.",["プロジェクトの完了を機に、次のキャリアを考えるようになりました。","専門性を高めるべく、準備を進めてまいりました。"]],
s:[["現職では一つのお客様を長く担当してきましたが、より幅広い業界の課題に{挑戦|ちょうせん}したいと考え、転職を決意いたしました。","Ở công ty hiện tại tôi phụ trách một khách hàng trong thời gian dài; tôi muốn thử thách với bài toán của nhiều ngành hơn nên quyết định chuyển việc."],
["現職への不満というよりは、キャリアの次の段階として環境を変える必要があると判断いたしました。","Không hẳn là bất mãn, mà tôi nhận định cần thay đổi môi trường cho bước tiếp theo của sự nghiệp.","給料を上げたいからです。"],
["御社を{志望|しぼう}した理由は、上流工程からお客様に{伴走|ばんそう}するスタイルに強く{惹|ひ}かれたためです。","Lý do tôi ứng tuyển là rất bị thu hút bởi cách quý công ty đồng hành cùng khách từ công đoạn thượng nguồn."],
["御社の物流DXの事例記事を{拝読|はいどく}し、まさに私が目指したい働き方だと感じました。","Đọc bài viết về case DX logistics của quý công ty, tôi thấy đó chính là cách làm việc tôi hướng tới."],
["入社後は、日越双方の開発体制を理解している強みを活かし、早期に貢献できると考えております。","Sau khi vào, tôi nghĩ mình có thể đóng góp sớm nhờ hiểu cả mô hình phát triển ở Nhật và Việt Nam."],
["プロジェクトの完了を機に、BAとしての専門性をさらに高めるべく、準備を進めてまいりました。","Nhân dịp dự án hoàn thành, tôi đã chuẩn bị để nâng cao hơn chuyên môn BA."]],
ls:["転職理由 面接 答え方 ネガティブ","Nghe cách trả lời lý do chuyển việc. Chú ý cách chuyển ý tiêu cực sang tích cực."],
rp:["面接官（事業会社の情報システム部長、穏やかだが核心を突く）","転職希望のBA","二次面接。転職理由と志望動機を聞かれる。","面接官が「要するに、今の会社に不満があるということですよね？」「うちでなくても、それはできますよね？」と切り込む。","否定的にならず、その会社でなければならない理由を具体的に言う。"],
n1:"文法｜ミックス（硬い書き言葉・敬語を含む）15"},

{sk:"ヒアリング：質問設計と深掘り",vi:"Hearing: thiết kế câu hỏi và đào sâu",dom:"re",
g:["深掘りの技法：と申しますと・具体的には・例えば","Mở rộng bằng câu hỏi mở (「どのように」「どのような場面で」), đào sâu bằng 「と申しますと」「具体的には」「例えば」, chốt bằng câu hỏi đóng (「〜ということでしょうか」). N1: 「〜に即して」 (dựa sát theo): 「実際の業務に即してお聞かせください」.",["と申しますと、紙とExcelの二重管理になっている、ということでしょうか。","実際の業務に即してお聞かせいただけますか。"]],
s:[["本日は現状の業務について、{率直|そっちょく}にお聞かせいただければと思います。","Hôm nay mong anh/chị chia sẻ thẳng thắn về nghiệp vụ hiện tại."],
["入居申込から契約{締結|ていけつ}まで、具体的にはどのような流れで進めていらっしゃいますか。","Từ lúc nhận đơn thuê đến ký hợp đồng, cụ thể đang làm theo luồng thế nào ạ.","流れを教えてください。"],
["と申しますと、紙とExcelの二重管理になっている、ということでしょうか。","Nghĩa là đang quản lý trùng lặp cả trên giấy và Excel, đúng không ạ."],
["その作業には、月にどのくらいの時間がかかっていますか。","Việc đó mỗi tháng mất khoảng bao nhiêu thời gian?"],
["今のやり方で一番お困りなのは、どの場面でしょうか。","Với cách làm hiện tại, khó khăn nhất là ở tình huống nào?"],
["なるほど。{例外|れいがい}的なケースとしては、どのようなものがございますか。","Tôi hiểu. Có những trường hợp ngoại lệ nào không ạ?"]],
ls:["ヒアリング 質問 コツ 要件定義","Nghe về kỹ năng hearing của BA/SE. Tìm thêm 「不動産管理 DX」 để nghe từ vựng ngành."],
rp:["顧客（不動産管理会社の賃貸管理課長、システムに懐疑的）","物件管理システム刷新のBA","第1回ヒアリング。入居申込から契約、更新、退去までの現状業務を聞き出す。","課長が「今まで通りでいいんですよ、特に困ってません」と繰り返し、具体的な話をしたがらない。後半で「実は更新漏れで一度トラブルがあって…」とポロッと言う。","本音の課題を引き出し、数字（件数・時間）を最低2つ取る。"],
n1:"文法｜文法形式の判断（逆接・譲歩：〜ものを・〜とはいえ・〜ながらも 等）15"},

{sk:"要件定義：要望と要件の切り分け",vi:"Tách mong muốn và yêu cầu thực sự",dom:"gov",
g:["N1：〜に越したことはない・〜までもない","「〜に越したことはない」: tốt nhất là…, không gì bằng (dùng để công nhận mong muốn nhưng mở đường ưu tiên). 「〜までもない」: không cần đến mức… Hỏi phân loại: 「必須でしょうか、それとも〜があれば望ましいというレベルでしょうか」.",["全部あるに越したことはないのですが、優先順位をつける必要がございます。","確認するまでもないかもしれませんが、念のため伺います。"]],
s:[["いただいたご要望を、必須要件と将来の検討事項に分けて整理させていただきました。","Tôi đã sắp xếp các mong muốn thành yêu cầu bắt buộc và hạng mục xem xét sau."],
["こちらは法令上必須でしょうか、それとも運用で{代替|だいたい}できるものでしょうか。","Mục này bắt buộc theo luật, hay có thể thay thế bằng vận hành?"],
["全部あるに{越|こ}したことはないのですが、予算と期間を踏まえると、優先順位をつける必要がございます。","Có đủ hết thì tốt nhất, nhưng xét ngân sách và thời gian thì cần xếp ưu tiên."],
["窓口業務の削減という目的に{照|て}らすと、まず電子申請を優先すべきかと存じます。","Đối chiếu với mục tiêu giảm việc tại quầy, tôi nghĩ nên ưu tiên nộp hồ sơ điện tử trước."],
["要件の背景にある課題を伺えますと、より適切な実現方法をご提案できます。","Nếu được nghe vấn đề đằng sau yêu cầu, tôi có thể đề xuất cách thực hiện phù hợp hơn."],
["本日の合意事項は、議事録にまとめて明日までに送付いたします。","Các điểm đã thống nhất hôm nay tôi sẽ tổng hợp biên bản và gửi trước ngày mai."]],
ls:["自治体 システム標準化 ニュース","Nghe tin NHK/ngắn về chuẩn hóa hệ thống địa phương. Shadowing câu dẫn của phát thanh viên."],
rp:["顧客（市役所・子育て支援課の係長、真面目で前例を重視）","電子申請システム導入のBA","要件一覧のレビュー会。係長が出した要望が40項目あり、予算内に収まらない。","係長が「全部必須です。議会で約束しているので」と言い切り、さらに「他の市はできていると聞きました」と付け加える。","目的に照らして優先順位をつけることに合意してもらう。"],
n1:"文法｜文の組み立て 8・文章の文法 7"},

{sk:"As-Is 業務フローの説明・確認",vi:"Mô tả và xác nhận luồng nghiệp vụ hiện tại",dom:"log",
g:["N1：〜に先立ち・〜に伴い・〜に応じて","Mô tả luồng: 「〜に先立ち」 (trước khi), 「〜に伴い」 (đi kèm theo), 「〜に応じて」 (tùy theo). Xác nhận: 「〜という理解で相違ないでしょうか」. Câu hỏi về 属人化 (phụ thuộc vào một người) rất hay gặp trong hearing.",["出荷に先立ち、検品を行います。","受注量に応じて、ピッキングの人数を変えています。"]],
s:[["まず現状の業務フローを、入荷から出荷まで順を追って確認させてください。","Trước hết cho tôi xác nhận luồng nghiệp vụ hiện tại theo thứ tự từ nhập đến xuất hàng."],
["入荷検品の後、ロケーションへの{格納|かくのう}は、どなたがどのタイミングで行っていますか。","Sau khi kiểm hàng nhập, ai là người xếp vào vị trí kệ và vào lúc nào?"],
["この手順は、{属人化|ぞくじんか}している部分はありますか。","Trong quy trình này có phần nào chỉ một người nắm không?"],
["繁忙期に限って、別の運用をされているということですね。","Tức là chỉ vào mùa cao điểm thì vận hành theo cách khác, đúng không."],
["この分岐のところで{手戻|てもど}りが発生している、という理解で{相違|そうい}ないでしょうか。","Hiểu là ở nhánh này đang phát sinh làm lại, có đúng không ạ."],
["例外処理も含めてAs-Isフローを{清書|せいしょ}し、金曜までにご確認いただけるようにいたします。","Tôi sẽ vẽ lại As-Is bao gồm cả xử lý ngoại lệ để anh/chị xem trước thứ Sáu."]],
ls:["倉庫 WMS 業務フロー 解説","Nghe giải thích luồng nghiệp vụ kho. Ghi lại 5 động từ chỉ thao tác kho (格納, 引当…)."],
rp:["顧客（物流センター長、現場叩き上げ、早口）","WMS刷新のBA","ホワイトボードを前に、入荷〜出荷のAs-Isフローを確認する打ち合わせ。","センター長が「それは表向きのフローで、実際は…」と例外処理を次々に出し、さらに「前のベンダーもそこを理解してくれなかった」と不満を漏らす。","例外を整理し、正しいAs-Isを口頭で要約して確認する。"],
n1:"文法｜類似文型の判別（〜につけ・〜につき・〜にあたって 等）15"},

{sk:"To-Be の提案と抵抗への対応",vi:"Đề xuất To-Be và xử lý sự phản đối",dom:"fin",
g:["N1：〜とはいえ・〜ものの と受け止め表現","Tiếp nhận phản đối trước: 「おっしゃることはごもっともです」「〜という懸念は承知しております」, rồi chuyển: 「とはいえ」「ものの」. Đề xuất nhỏ để giảm sợ hãi: 「まずは〜に限定して試行してはいかがでしょうか」.",["懸念はごもっともです。とはいえ、現状のままでは対応しきれなくなるおそれがございます。","効果は見込めるものの、移行期間の負担は避けられません。"]],
s:[["To-Beでは、与信審査の一次判定をシステムで自動化することをご提案いたします。","Ở To-Be, chúng tôi đề xuất tự động hóa vòng thẩm định tín dụng đầu tiên."],
["おっしゃることはごもっともです。現場の負担が一時的に増えるという懸念は、私どもも認識しております。","Anh nói rất đúng. Chúng tôi cũng nhận thức lo ngại gánh nặng tạm thời tăng ở hiện trường.","でもシステムの方が早いです。"],
["とはいえ、現状のままですと、審査件数の増加に対応しきれなくなるおそれがございます。","Tuy vậy, nếu giữ nguyên, có nguy cơ không theo kịp số hồ sơ tăng."],
["移行期間中は、従来の手順と並行して運用できるようにいたします。","Trong giai đoạn chuyển đổi, sẽ vận hành song song với quy trình cũ."],
["最終判断は引き続き審査担当の方が行いますので、責任の{所在|しょざい}は変わりません。","Quyết định cuối cùng vẫn do người thẩm định đưa ra, nên trách nhiệm không thay đổi."],
["まずは一つの商品に限定して{試行|しこう}し、効果を検証してはいかがでしょうか。","Hay là trước hết thử với một sản phẩm và kiểm chứng hiệu quả?"]],
ls:["銀行 審査 AI 自動化 ニュース","Nghe tin về tự động hóa thẩm định ở ngân hàng. Shadowing đoạn phỏng vấn người trong ngành."],
rp:["顧客（銀行の融資審査部・課長、ベテラン審査役、変化に慎重）","審査業務改革のBA","To-Be案（一次判定の自動化）の説明会。","課長が「機械に審査ができるわけがない」「事故が起きたら誰が責任を取るんですか」と強く反対し、部下の前で引けない雰囲気になる。","相手の顔を立てつつ、試行という形で合意の糸口をつかむ。"],
n1:"読解｜内容理解（短文）5題 5問・語彙/文法 10"},

{sk:"非機能要件・前提条件の確認",vi:"Xác nhận yêu cầu phi chức năng và tiền đề",dom:"api",
g:["N1：〜を前提に・〜を踏まえて・〜いかんでは","「〜を前提に」 (lấy làm tiền đề), 「〜を踏まえて」 (dựa trên), 「〜いかんでは／いかんによっては」 (tùy vào… mà có thể): 「件数いかんでは、方式を見直す必要がございます」. Tiền đề phải được nói ra miệng và ghi vào biên bản.",["リトライで対応することを前提に設計しております。","データ件数いかんでは、方式を見直す必要がございます。"]],
s:[["連携方式は、リアルタイムとバッチのどちらを想定されていますか。","Phương thức tích hợp anh/chị đang hình dung là realtime hay batch?"],
["夜間バッチの処理時間が延びた場合、翌朝の業務に影響はございますか。","Nếu batch đêm kéo dài, có ảnh hưởng đến nghiệp vụ sáng hôm sau không ạ."],
["連携先の障害時には、リトライで対応するという前提でよろしいでしょうか。","Khi hệ thống đối tác gặp sự cố, ta lấy tiền đề là xử lý bằng retry, được không ạ."],
["データ件数は、ピーク時でどの程度を見込んでおけばよいでしょうか。","Số lượng dữ liệu lúc cao điểm nên dự tính khoảng bao nhiêu?"],
["文字コードや{外字|がいじ}の扱いについても、事前に取り決めておきたいと考えております。","Tôi cũng muốn thống nhất trước về mã ký tự và ký tự ngoài bảng mã."],
["件数{いかん|}では、改めて見積りを調整させていただく可能性がございます。","Tùy số lượng, có khả năng chúng tôi phải điều chỉnh lại báo giá."]],
ls:["非機能要件 とは 解説","Nghe giải thích yêu cầu phi chức năng. Tìm thêm 「API連携 設計 ポイント」."],
rp:["顧客（流通業の情報システム部・主任、技術に詳しく細かい）","基幹システムとECの連携プロジェクトのBA","連携方式と非機能要件（性能、障害時、データ量）を確認する打ち合わせ。","主任が「夜間バッチは絶対に止められない。でもリアルタイムでも欲しい」と矛盾する条件を出し、「それくらいベンダーさんで考えてよ」と丸投げしてくる。","前提条件を明文化し、トレードオフを相手に判断してもらう。"],
n1:"読解｜内容理解（短文）4題 4問・中文 1題 3問・語彙 8"},

{sk:"面接③：強み・弱み",vi:"Phỏng vấn: điểm mạnh, điểm yếu",dom:"job",
g:["N1：〜きらいがある・〜がちだ と弱みの語り方","「〜きらいがある」 (có khuynh hướng (xấu)…) trang trọng hơn 「〜がちだ」. Mẫu nói điểm yếu: điểm yếu → ví dụ ngắn → cách đang khắc phục bằng cơ chế. Mẫu nói điểm mạnh: 1 từ khóa → ví dụ có số → liên hệ với công việc ứng tuyển.",["細部にこだわりすぎるきらいがあります。","忙しいと一人で抱え込みがちでした。"]],
s:[["私の強みは、関係者の{利害|りがい}を整理し、合意に導く調整力です。","Điểm mạnh của tôi là khả năng điều phối: sắp xếp lợi ích các bên và dẫn tới đồng thuận."],
["前のプロジェクトでは、お客様と開発チームの認識のずれを早期に発見し、手戻りを防ぎました。","Ở dự án trước, tôi phát hiện sớm độ lệch nhận thức giữa khách và đội dev, ngăn được làm lại."],
["弱みとしては、細部にこだわりすぎる{きらい|}がある点です。","Điểm yếu là tôi có khuynh hướng quá chăm chút tiểu tiết.","弱みはありません。"],
["そのため現在は、作業前に優先度と完了の基準を決めてから着手するようにしています。","Vì vậy hiện tôi luôn quyết định độ ưu tiên và tiêu chí hoàn thành trước khi bắt tay vào việc."],
["おっしゃるとおり、BAとしては{致命的|ちめいてき}にもなり得ると認識しております。","Đúng như anh nói, tôi nhận thức với BA điều đó có thể thành chí mạng."],
["だからこそ、{自覚|じかく}したうえで仕組みで補うことを意識しております。","Chính vì vậy, tôi tự nhận thức và chú ý bù đắp bằng cơ chế."]],
ls:["面接 強み 弱み 答え方 例","Nghe mẫu trả lời điểm mạnh/yếu. Shadowing câu chuyển 「そのため現在は〜」."],
rp:["面接官（SIerの開発部長、ロジカルで深掘りが多い）","転職希望のBA","一次面接の中盤。強みと弱みを聞かれる。","面接官が「その弱み、BAとして致命的じゃないですか？」「強みの根拠、数字で言えます？」と続けて突っ込む。","根拠と改善策をセットで、動揺せず答える。"],
n1:"文法｜総合（形式判断 7・並べ替え 4・文章の文法 4）"},

// ===== Week 4 =====
{sk:"仕様の矛盾指摘（相手の顔を立てる）",vi:"Chỉ ra mâu thuẫn spec mà vẫn giữ thể diện cho khách",dom:"edu",
g:["顔を立てる指摘：主語をぼかす・自分側に引き取る","Không nói 「仕様が矛盾しています」. Thay bằng: 「私の理解不足かもしれませんが」, 「〜のように見受けられます」, 「どちらかが誤りというより、前提としているケースが違うのかもしれません」. N1: 「〜とも限らない」 (chưa chắc…).",["二つのご回答で、基準日が異なっているように見受けられます。","どちらかが誤りとも限らないのですが、念のため確認させてください。"]],
s:[["私の理解不足かもしれませんが、一点確認させていただけますでしょうか。","Có thể do tôi hiểu chưa đủ, nhưng cho tôi xác nhận một điểm được không ạ."],
["前回のQAのご回答と、表示列の仕様とで、参照する履歴の基準日が異なっているように{見受|みう}けられます。","Có vẻ câu trả lời QA trước và spec cột hiển thị đang lấy ngày chuẩn khác nhau khi tham chiếu lịch sử.","仕様が矛盾しています。"],
["どちらかが誤りというより、前提としているケースが違うのかもしれません。","Có lẽ không phải bên nào sai, mà là trường hợp được giả định khác nhau."],
["念のため具体例で確認させてください。7月から9月の集計で、9月にクラスが変わった園児の場合です。","Cho tôi xác nhận bằng ví dụ: kỳ tổng hợp tháng 7–9, trẻ đổi lớp vào tháng 9."],
["以前決めた内容と異なる場合は、影響範囲もあわせて整理いたします。","Nếu khác với nội dung đã quyết trước đây, tôi sẽ sắp xếp luôn phạm vi ảnh hưởng."],
["ご確認いただけましたら、仕様書に反映し、関係者へ共有いたします。","Khi anh/chị xác nhận xong, tôi sẽ phản ánh vào spec và chia sẻ cho các bên."]],
ls:["相手を立てる 指摘の仕方 ビジネス","Nghe cách góp ý khéo. Shadowing các câu mở đầu làm mềm (「〜かもしれませんが」)."],
rp:["顧客（保育施設運営法人の本部担当、要件の決定者に近い立場、丁寧だが自分の回答には自信がある）","保育システムのBA","集計対象設定のQA確認会。前回のQA回答（期間初日時点の履歴）と列仕様（期間内の最新履歴）が食い違っている。","担当者が「それは前に決めましたよね？」とやや不機嫌になり、さらに「現場からは早くしてほしいと言われてるんです」と急かす。","相手を責めずに具体例で矛盾を示し、どちらを採るか決めてもらう。"],
n1:"読解｜内容理解（短文）5題 5問・語彙/文法 10"},

{sk:"不明点の確認と詰め方",vi:"Hỏi làm rõ và chốt câu trả lời mơ hồ",dom:"ins",
g:["N1：〜にかかわらず・〜を問わず・〜如何によらず","Chốt câu trả lời mơ hồ: 「〜という理解でよろしいでしょうか」, đặt kỳ hạn 「回答期限を〜とさせていただいてもよろしいでしょうか」, và tiền đề mặc định nếu quá hạn. 「件数の多寡にかかわらず」 (bất kể nhiều hay ít), 「理由を問わず」.",["件数の多寡にかかわらず、対象外とする扱いで問題ないでしょうか。","期限までにご回答が難しい場合は、一旦こちらの仮定で進めさせていただきます。"]],
s:[["先ほどのご回答ですが、「基本的には不要」というのは、例外もあり得る、という理解でよろしいでしょうか。","Câu trả lời lúc nãy, “về cơ bản là không cần”, tôi hiểu là vẫn có thể có ngoại lệ, đúng không ạ."],
["特約の途中付加は、契約更新時に限る、ということで相違ございませんか。","Việc thêm điều khoản bổ sung giữa chừng chỉ được làm lúc gia hạn hợp đồng, có đúng không ạ."],
["社内でご確認が必要でしたら、回答期限を来週水曜とさせていただいてもよろしいでしょうか。","Nếu cần xác nhận nội bộ, cho phép tôi đặt hạn trả lời là thứ Tư tuần sau được không ạ."],
["期限までにご回答が難しい場合は、一旦こちらの{仮定|かてい}で進めさせていただきます。","Nếu khó trả lời trước hạn, chúng tôi xin tạm tiến hành theo giả định của mình."],
["件数の{多寡|たか}にかかわらず、対象外とする扱いで問題ないでしょうか。","Bất kể số lượng nhiều hay ít, xử lý là ngoài đối tượng có ổn không ạ."],
["認識を合わせるため、本日の内容をQA表に{追記|ついき}しておきます。","Để thống nhất nhận thức, tôi sẽ ghi bổ sung nội dung hôm nay vào bảng QA."]],
ls:["保険 契約 保全 業務 とは","Nghe giải thích nghiệp vụ bảo hiểm (保全, 特約). Ghi lại 3 thuật ngữ mới."],
rp:["顧客（生命保険会社の契約管理部・PM、多忙で回答が曖昧）","契約管理システム改修のBA","QA表の未回答10件を一気に確認する打ち合わせ（30分枠）。","PMが「基本的には」「ケースバイケースで」と曖昧に答え続け、途中で「それ、そちらで決めてもらえれば」と責任を回避しようとする。","曖昧な回答を「理解の確認＋期限＋仮定」で一つずつ確定させる。"],
n1:"読解｜内容理解（中文）3題 9問・語彙 6"},

{sk:"進捗報告（定例）",vi:"Báo cáo tiến độ trong họp định kỳ",dom:"mfg",
g:["数字で語る進捗と N1：〜に至っては・〜をもって","Báo cáo bằng số: 「計画比〇%」「〇日程度の遅れ」「挽回の見込み」. 「〜に至っては」 (thậm chí đến…, nêu ví dụ cực đoan, tốt hoặc xấu). 「以上をもちまして〜とさせていただきます」 để kết thúc trang trọng.",["不良集計機能に至っては、前倒しで完了しております。","以上をもちまして、進捗報告とさせていただきます。"]],
s:[["今週の進捗について、計画比でご報告いたします。","Tôi xin báo cáo tiến độ tuần này so với kế hoạch."],
["全体では予定の92%で、2日程度の遅れとなっております。","Tổng thể đạt 92% kế hoạch, chậm khoảng 2 ngày."],
["遅延の主な要因は、検査成績書の帳票仕様の確定が、当初の見込みより遅れたことです。","Nguyên nhân chính là việc chốt spec biểu mẫu phiếu kết quả kiểm tra chậm hơn dự kiến ban đầu.","お客様の返事が遅かったからです。"],
["来週中に要員を1名追加し、月末までに{挽回|ばんかい}する見込みです。","Tuần sau bổ sung 1 người, dự kiến bắt kịp trước cuối tháng."],
["なお、不良集計機能に{至|いた}っては、前倒しで完了しております。","Ngoài ra, riêng chức năng tổng hợp lỗi thì đã xong sớm hơn kế hoạch."],
["以上をもちまして、進捗報告とさせていただきます。","Báo cáo tiến độ của tôi xin dừng ở đây."]],
ls:["定例会議 進捗報告 例","Nghe mẫu báo cáo tiến độ. Tìm thêm 「品質管理 トレーサビリティ 製造業」."],
rp:["顧客（自動車部品メーカーの品質保証部・PM、数字に厳しい）","品質管理システム開発のBA","週次定例での進捗報告。遅延2日。","PMが「その遅れ、本当に2日で済むんですか？根拠は？」「先週も挽回すると言ってましたよね」と詰め、さらに新しい帳票の追加を口にする。","数字と根拠で説明し、追加要望はその場で約束せず持ち帰る。"],
n1:"読解｜短文 3題 3問・中文 2題 6問・語彙/文法 6"},

{sk:"リスク報告・エスカレーション",vi:"Báo cáo rủi ro, escalation lên cấp trên",dom:"ec",
g:["エスカレーションの構成と N1：〜おそれがある・〜次第では","Cấu trúc: tóm tắt 1 câu → nguyên nhân → xác suất × ảnh hưởng → phương án và chi phí → điều cần cấp trên quyết. 「〜おそれがある」 (có nguy cơ, trang trọng), 「〜次第では」 (tùy vào…mà).",["本番リリースが2週間遅れるおそれがあります。","先方の回答次第では、さらに判断が必要になるかもしれません。"]],
s:[["部長、決済代行会社との連携について、エスカレーションさせてください。","Thưa trưởng phòng, cho tôi escalate về việc tích hợp với công ty trung gian thanh toán."],
["先方のAPI仕様変更により、本番リリースが2週間遅れるおそれがあります。","Do bên đối tác đổi spec API, có nguy cơ release production chậm 2 tuần."],
["発生確率は高く、影響は年末セールの売上に{直結|ちょっけつ}します。","Xác suất xảy ra cao, ảnh hưởng trực tiếp đến doanh thu đợt sale cuối năm."],
["対策として、旧APIで先行リリースし、年明けに切り替える案を考えております。","Phương án là release trước với API cũ, sang năm mới chuyển đổi."],
["この案ですと追加工数が約10{人日|にんにち}発生しますので、ご判断をいただきたく存じます。","Phương án này phát sinh thêm khoảng 10 man-day, nên tôi xin anh quyết định.","どうしましょうか。"],
["先方の回答次第では、さらに前倒しの判断が必要になるかもしれません。","Tùy câu trả lời của đối tác, có thể cần quyết định sớm hơn nữa."]],
ls:["リスク報告 エスカレーション 上司","Nghe cách escalation. Shadowing phần trình bày phương án."],
rp:["上司（自社の部長、結論を急ぐタイプ）","ECサイトリニューアルのBA","決済代行会社のAPI仕様変更により、年末セール前のリリースが危うい。","部長が「で、どうするの？」と結論を急かし、「その10人日、誰が払うの？お客様に言える？」と追い込む。","リスクを定量的に伝え、判断材料と自分の推奨を示す。"],
n1:"読解｜中文 3題 9問・統合理解 1題 2問・語彙 4"},

{sk:"開発チームへの仕様説明",vi:"Giải thích spec cho đội phát triển",dom:"saas",
g:["背景から話す説明と N1：〜ゆえに・〜とあって","Với kỹ sư, giải thích “vì sao” trước “cái gì”. Phân biệt điều khách không nhượng bộ (譲れない点) và điều có thể linh hoạt. 「〜ゆえに」 (vì…, văn viết), 「〜とあって」 (vì là… nên): 「監査対応とあって、証跡は必須です」.",["監査対応とあって、証跡を残すことは必須です。","標準機能を優先するがゆえに、画面の自由度は下がります。"]],
s:[["この仕様の背景から説明させてください。","Cho tôi giải thích bối cảnh của spec này trước."],
["現行システムでは承認が3段階ありますが、新システムでは標準機能に合わせて2段階に{寄|よ}せる方針です。","Hệ thống cũ có 3 bước phê duyệt, nhưng hệ thống mới sẽ dồn về 2 bước theo chức năng chuẩn."],
["実装コストが高いということであれば、代替案を一緒に検討させてください。","Nếu chi phí cài đặt cao, ta cùng xem xét phương án thay thế nhé."],
["お客様にとって{譲|ゆず}れないのは監査証跡が残ることなので、画面の作りは柔軟に考えて大丈夫です。","Điều khách không nhượng bộ là phải lưu audit trail, còn cấu trúc màn hình có thể linh hoạt."],
["読み違いを防ぐため、受入条件をチケットに{明記|めいき}しておきます。","Để tránh hiểu sai, tôi sẽ ghi rõ tiêu chí nghiệm thu vào ticket."],
["不明点は実装前に遠慮なく聞いてください。先方への確認は私が{巻|ま}き取ります。","Có gì chưa rõ cứ hỏi trước khi code. Việc hỏi lại khách để tôi lo."]],
ls:["エンジニア 仕様説明 伝わる","Nghe về cách giải thích spec cho kỹ sư. Tìm thêm 「Fit&Gap 分析 SaaS」."],
rp:["自社のテックリード（日本人、30代、合理主義で率直）","SaaSリプレイス案件のBA","承認ワークフローの仕様を開発チームに説明する。","テックリードが「その仕様、標準機能から外れるから実装コストが3倍になる。お客様に断ってよ」と言い、BAの調整不足を指摘する。","背景と譲れない点を示し、代替案を一緒に作る方向に持っていく。"],
n1:"読解｜長文 1題 4問・中文 2題 6問・語彙/文法 5"},

{sk:"面接④：成果を STAR で話す",vi:"Phỏng vấn: kể thành tích theo STAR",dom:"job",
g:["STAR と N1：〜を皮切りに・〜に至るまで","Situation（状況）→ Task（課題）→ Action（自分の行動）→ Result（結果, có số). Người phỏng vấn Nhật hay hỏi 「あなた個人の貢献は？」, nên Action dùng chủ ngữ 「私は」. 「〜を皮切りに」 (bắt đầu từ…, lan rộng), 「〜に至るまで」 (đến tận…).",["この経験を皮切りに、他の案件でも同じ仕組みが採用されました。","要件定義から運用定着に至るまで担当しました。"]],
s:[["状況としては、全国約200施設で使うシステムのリプレイス案件でした。","Bối cảnh là dự án thay thế hệ thống dùng ở khoảng 200 cơ sở trên toàn quốc."],
["課題は、要件変更が{頻発|ひんぱつ}し、手戻りが全体工数の3割に達していたことです。","Vấn đề là thay đổi yêu cầu liên tục, phần làm lại chiếm tới 30% tổng công số."],
["そこで私は、変更要望を影響度で分類するルールを提案し、週次でお客様と優先度を合意する場を設けました。","Vì vậy tôi đề xuất quy tắc phân loại yêu cầu thay đổi theo mức ảnh hưởng và lập buổi thống nhất ưu tiên hằng tuần với khách."],
["結果として、手戻りは半年で約半分に減り、リリースも予定どおりに実施できました。","Kết quả là trong nửa năm phần làm lại giảm khoảng một nửa và release đúng kế hoạch."],
["私個人の貢献としては、ルールの設計と、お客様側の合意を取り付けた点が大きいと考えております。","Đóng góp cá nhân của tôi chủ yếu là thiết kế quy tắc và lấy được sự đồng thuận của khách.","チームみんなで頑張りました。"],
["この経験を{皮切|かわき}りに、他の案件でも同じ仕組みが採用されました。","Bắt đầu từ kinh nghiệm này, cơ chế đó được áp dụng ở cả các dự án khác."]],

{sk:"仕様変更の受け方・影響説明",vi:"Tiếp nhận thay đổi spec và giải thích ảnh hưởng",dom:"acc",
g:["影響の三点セットと N1：〜たところで","Khi khách yêu cầu thay đổi: tiếp nhận → phạm vi ảnh hưởng → công số và lịch → cách xử lý hợp đồng (有償). 「〜たところで」 (dù có… cũng không…): 「今から対応したところで、今月の締めには間に合いません」. 「恐縮ながら別途お見積りとさせていただけますでしょうか」 là cách nói mềm cho “phải trả thêm tiền”.",["今から対応したところで、今月の締めには間に合いません。","恐縮ながら、別途お見積りとさせていただけますでしょうか。"]],
s:[["ご要望の内容は承知いたしました。まず影響範囲を確認させてください。","Tôi đã nắm nội dung yêu cầu. Trước hết cho tôi kiểm tra phạm vi ảnh hưởng."],
["一見小さな変更に見えますが、承認フローと仕訳連携の両方に影響がございます。","Nhìn qua có vẻ là thay đổi nhỏ, nhưng ảnh hưởng cả luồng phê duyệt lẫn liên kết bút toán."],
["{概算|がいさん}ですが、設計からテストまで約5人日を見込んでおります。","Ước tính sơ bộ, từ thiết kế đến kiểm thử khoảng 5 man-day."],
["契約の範囲外となりますので、恐縮ながら別途お見積りとさせていただけますでしょうか。","Vì nằm ngoài phạm vi hợp đồng, xin phép được báo giá riêng ạ.","これは有料です。"],
["今から対応したところで、今月の締めには間に合いませんので、来月分からの適用をご提案いたします。","Dù làm từ bây giờ cũng không kịp chốt tháng này, nên tôi đề xuất áp dụng từ tháng sau."],
["次回の定例までに、影響一覧とお見積りをお持ちいたします。","Trước buổi họp định kỳ tới, tôi sẽ mang danh sách ảnh hưởng và báo giá."]],
ls:["仕様変更 対応 追加費用 交渉","Nghe về cách xử lý thay đổi spec và chi phí phát sinh. Tìm thêm 「インボイス制度 経費精算 影響」."],
rp:["顧客（メーカーの経理課長、人当たりはいいが値切り上手）","経費精算システム導入のBA","UAT中に「承認者を部門ごとに変えられるようにしたい」という要望が出る。","課長が「ほんの少しの変更ですよね？今回はサービスでお願いしますよ」と笑顔で押し、さらに「今月の締めから使いたい」と言う。","関係を保ちながら、影響・費用・時期を明確にして持ち帰る。"],
n1:"読解｜長文 1題 4問・統合理解 1題 2問・語彙/文法 9"},

{sk:"スコープ交渉・優先順位付け",vi:"Đàm phán phạm vi, xếp ưu tiên",dom:"ec",
g:["N1：〜ざるを得ない・〜ないことには","「〜ざるを得ない」 (buộc phải, không còn cách nào), 「〜ないことには〜ない」 (nếu không… thì không thể…): 「優先順位を決めないことには、計画が立てられません」. Đàm phán phạm vi: cố định ngày → đổi phạm vi; “nếu thêm cái này thì bỏ cái gì?”.",["すべてを盛り込むと、品質を犠牲にせざるを得ません。","優先順位を決めないことには、計画が立てられません。"]],
s:[["リリース日を動かせないという前提で、範囲を調整させていただけないでしょうか。","Với tiền đề không dời ngày release, cho phép chúng tôi điều chỉnh phạm vi được không ạ."],
["今回のリリースでは在庫引当の自動化を最優先とし、分析画面は次フェーズに回す案です。","Phương án là release lần này ưu tiên tự động hóa giữ tồn kho, màn hình phân tích dời sang phase sau."],
["すべてを{盛|も}り込むと、品質を{犠牲|ぎせい}にせざるを得ません。","Nếu nhồi hết vào, buộc phải hy sinh chất lượng."],
["店舗の欠品を減らすという目的に照らせば、効果の大部分は初回リリースで得られます。","Đối chiếu với mục tiêu giảm hết hàng tại cửa hàng, phần lớn hiệu quả có được ngay ở lần release đầu."],
["どうしても外せない機能がございましたら、代わりにどれを{後|あと}ろ{倒|だお}しにするか、ご一緒に決めさせてください。","Nếu có chức năng nhất định không bỏ được, ta cùng quyết xem dời cái nào thay vào."],
["合意いただいた範囲は、本日中に書面で確認させていただきます。","Phạm vi đã thống nhất tôi sẽ xác nhận bằng văn bản trong hôm nay."]],
ls:["スコープ 交渉 プロジェクト 優先順位","Nghe về quản lý phạm vi. Tìm thêm 「小売 在庫 最適化 AI ニュース」."],
rp:["顧客（小売チェーンの事業部長、声が大きく決断が早い）","在庫管理システム刷新のBA","リリース日は株主総会の発表で固定。残り機能が多すぎる。","事業部長が「全部やってもらわないと困る。人を増やせばいいでしょ」と言い、途中で「分析画面こそ社長が一番見たいものだ」と優先順位をひっくり返す。","目的に照らした優先順位で合意し、トレードオフを相手に選ばせる。"],
n1:"読解｜主張理解（長文）1題 4問・中文 2題 6問・語彙 5"},

{sk:"納期交渉",vi:"Đàm phán deadline",dom:"med",
g:["段階リリースの提案と N1：〜ないまでも・〜べく","Không nói thẳng 「間に合いません」 rồi dừng; tách phần bắt buộc đúng hạn và phần có thể lùi, kèm cách tạm thời (回避策). 「〜ないまでも」 (dù không đến mức…thì cũng…), 「〜べく」 (để…).",["全面延期とまではいかないまでも、段階リリースが現実的かと存じます。","改定に間に合わせるべく、体制を強化いたします。"]],
s:[["改定対応の重要性は、十分承知しております。","Chúng tôi hiểu rõ tầm quan trọng của việc đáp ứng sửa đổi."],
["{率直|そっちょく}に申し上げますと、全機能を4月1日に{揃|そろ}えるのは困難な状況です。","Nói thẳng thắn, để đủ toàn bộ chức năng vào ngày 1/4 là tình hình khó khăn.","4月1日は無理です。"],
["算定ロジックの改修は、期日までに必ず間に合わせます。","Phần sửa logic tính phí chắc chắn sẽ kịp hạn."],
["帳票のレイアウト変更については、4月中旬のリリースとさせていただけないでしょうか。","Riêng thay đổi layout biểu mẫu, xin cho phép release vào giữa tháng 4 được không ạ."],
["その間は、現行帳票に手書きで{補記|ほき}いただく運用で{回避|かいひ}できるかと存じます。","Trong thời gian đó, có thể né bằng cách viết tay bổ sung vào biểu mẫu hiện tại."],
["全面延期とまではいかないまでも、段階リリースであれば品質を保ったまま対応可能です。","Dù không đến mức hoãn toàn bộ, nếu release theo giai đoạn thì vẫn giữ được chất lượng."]],
ls:["診療報酬改定 システム対応 ベンダー","Nghe tin về sửa đổi phí khám chữa bệnh và gánh nặng của vendor. Shadowing đoạn giải thích."],
rp:["顧客（総合病院の医療情報システム課長、普段は温厚だが今回は必死）","電子カルテ周辺システムのBA","診療報酬改定（4/1施行）に合わせた改修。全機能は間に合わない。","課長が「間に合わなかったら病院が損をするんですよ。契約違反じゃないですか」と強く言い、上層部への説明資料を今日中に求める。","できること・できないこと・回避策を整理し、段階リリースで合意する。"],

{sk:"見積り交渉・値引き要求",vi:"Đàm phán báo giá, xử lý yêu cầu giảm giá",dom:"re",
g:["根拠で守る見積りと N1：〜とあれば・〜ならいざしらず","Không giảm giá suông; đổi phạm vi/điều kiện lấy giá. 「勉強させていただく」 = giảm giá (cách nói thương mại). 「〜とあれば」 (nếu là… thì…), 「〜ならいざしらず」 (nếu là… thì còn được, chứ…).",["複数年のご契約とあれば、保守費用の面で勉強させていただけるかと存じます。","小規模ならいざしらず、この規模で移行を省くのは危険です。"]],
s:[["お見積りの{根拠|こんきょ}について、{内訳|うちわけ}をご説明させてください。","Cho tôi giải thích chi tiết căn cứ của báo giá."],
["他社さんのお見積りと比べて高いとのご指摘、承知いたしました。","Tôi đã ghi nhận ý kiến là đắt hơn báo giá của công ty khác."],
["恐れ入りますが、他社さんの見積りには、データ移行と研修は含まれていますでしょうか。","Xin lỗi, báo giá của bên kia có bao gồm chuyển đổi dữ liệu và đào tạo không ạ."],
["単純な値引きは難しいのですが、範囲を見直すことで金額を調整することは可能です。","Giảm giá đơn thuần thì khó, nhưng có thể điều chỉnh số tiền bằng cách xem lại phạm vi.","安くできません。"],
["複数年のご契約とあれば、保守費用の面で{勉強|べんきょう}させていただけるかと存じます。","Nếu là hợp đồng nhiều năm, chúng tôi có thể ưu đãi phần phí bảo trì."],
["社内で検討し、{明後日|あさって}までに改めてご提示いたします。","Chúng tôi sẽ cân nhắc nội bộ và gửi lại đề xuất trước ngày kia."]],
ls:["値引き交渉 断り方 営業","Nghe về cách xử lý yêu cầu giảm giá. Tìm thêm 「不動産テック 賃貸管理」."],

{sk:"お断り：関係を壊さず NO",vi:"Từ chối mà không làm hỏng quan hệ",dom:"gov",
g:["N1：〜わけにはいかない・〜かねます","「〜わけにはいかない／まいりません」 (không thể (vì lý do đạo lý/trách nhiệm)). 「対応いたしかねます」 là từ chối lịch sự chuẩn. Cấu trúc: cảm ơn/tiếp nhận → lý do khách quan → từ chối rõ → phương án thay thế → giữ quan hệ.",["品質を担保できない形でお受けするわけにはまいりません。","現行の契約範囲では、対応いたしかねます。"]],
s:[["せっかくのご依頼ですが、今回は{見送|みおく}らせていただきたく存じます。","Rất cảm kích lời đề nghị, nhưng lần này xin phép được từ chối."],
["現行の契約範囲では、対応いたしかねます。","Trong phạm vi hợp đồng hiện tại, chúng tôi không thể đáp ứng."],
["課長のご意向であることは承知しておりますが、品質を担保できない形でお受けするわけにはまいりません。","Tôi hiểu đây là ý của trưởng phòng, nhưng không thể nhận theo cách không đảm bảo được chất lượng."],
["ご期待に{沿|そ}えず、大変{心苦|こころぐる}しいのですが…。","Không đáp ứng được kỳ vọng, chúng tôi thật áy náy…"],
["代わりに、次年度の予算要求に間に合うよう、概算資料をご用意することは可能です。","Thay vào đó, chúng tôi có thể chuẩn bị tài liệu ước tính kịp cho đề xuất ngân sách năm sau."],
["今後ともお力になれる部分は精一杯対応いたしますので、引き続きよろしくお願いいたします。","Những phần có thể hỗ trợ, chúng tôi sẽ cố hết sức; mong tiếp tục được hợp tác."]],
ls:["上手な断り方 取引先 ビジネス","Nghe cách từ chối đối tác. Shadowing phần câu đưa phương án thay thế."],
rp:["顧客（市役所の情報政策課・主査、上司の意向を盾にする）","住民情報システム保守のBA","年度末に「ついでに」と、契約外の帳票追加を無償で頼まれる。","主査が「課長がもうOKしてるんで」「前のベンダーさんはやってくれましたよ」と押し、断ると「次の入札にも影響しますよ」とほのめかす。","はっきり断りつつ、代替案で関係を保つ。"],

{sk:"面接⑤：苦労したプロジェクト",vi:"Phỏng vấn: dự án khó khăn nhất",dom:"job",
g:["N1：〜ながらも・〜をよそに・〜にもかかわらず","Kể chuyện khó khăn: không đổ lỗi (người phỏng vấn kiểm tra điều này), nói điều mình đã làm và bài học. 「〜ながらも」 (dù… nhưng vẫn), 「〜をよそに」 (mặc kệ, bất chấp…), 「〜にもかかわらず」.",["仕様が固まらないながらも、開発を止めるわけにはいかない状況でした。","周囲の心配をよそに、予定どおりリリースできました。"]],
s:[["最も苦労したのは、本番直前に法改正の影響が{判明|はんめい}した案件です。","Khó khăn nhất là dự án mà ngay trước go-live mới phát hiện ảnh hưởng của sửa luật."],
["仕様が固まらないながらも、開発を止めるわけにはいかない状況でした。","Dù spec chưa chốt, tình hình là không thể dừng phát triển."],
["私は、確定している部分と未確定の部分を切り分け、後者を後から差し替えられる設計を提案しました。","Tôi tách phần đã chốt và chưa chốt, đề xuất thiết kế để có thể thay phần chưa chốt về sau."],
["上司の判断ミスではなく、当時の情報では誰にも予測できなかったと考えております。","Tôi nghĩ đó không phải lỗi phán đoán của cấp trên, mà với thông tin lúc đó không ai đoán trước được.","上司の判断が悪かったです。"],
["振り返ると、もっと早い段階でリスクとして共有すべきだったと反省しております。","Nhìn lại, tôi rút kinh nghiệm là lẽ ra nên chia sẻ như một rủi ro sớm hơn."],
["この経験から、不確実な要素ほど早めに{可視化|かしか}することを{徹底|てってい}しています。","Từ kinh nghiệm đó, tôi luôn đưa các yếu tố bất định ra cho mọi người thấy càng sớm càng tốt."]],
ls:["面接 苦労した経験 答え方","Nghe mẫu trả lời “kinh nghiệm khó khăn”. Chú ý cách nói bài học (反省・学び)."],
rp:["面接官（事業会社のIT部門長、穏やかだが鋭い）","転職希望のBA","最終面接。「一番苦労したプロジェクト」を聞かれる。","面接官が「それは上司の判断ミスでは？」「あなたなら最初からどうしましたか？」と、他責か自責かを試す質問を重ねる。","他責にせず、自分の行動と学びを語る。"],

{sk:"会議の司会",vi:"Chủ trì cuộc họp",dom:"hr",
g:["司会の定型と N1：〜はさておき","Mở: 「定刻になりましたので」 → mục tiêu 「本日のゴールは〜」 → thời gian. Kéo lại khi lạc đề: 「〜はさておき、一旦本題に戻らせてください」, 「別途打ち合わせの場を設けます」. Kết: xác nhận 決定事項 và 宿題 (ai, khi nào).",["その件はさておき、一旦本題に戻らせてください。","最後に決定事項と宿題を確認させてください。"]],
s:[["定刻になりましたので、始めさせていただきます。","Đã đến giờ, xin phép bắt đầu."],
["本日のゴールは、年末調整の入力画面の仕様を確定することです。","Mục tiêu hôm nay là chốt spec màn hình nhập quyết toán thuế cuối năm."],
["時間の都合上、各議題15分を目安に進めます。","Vì thời gian, mỗi chủ đề sẽ khoảng 15 phút."],
["貴重なご意見ありがとうございます。その件は{さておき|}、一旦本題に戻らせてください。","Cảm ơn ý kiến quý báu. Chuyện đó tạm gác lại, cho tôi quay lại chủ đề chính.","話がずれています。"],
["今の論点は別途打ち合わせの場を設けますので、持ち帰りとさせていただけますか。","Luận điểm này tôi sẽ sắp xếp buổi riêng, xin cho phép mang về được không ạ."],
["最後に、決定事項と宿題を確認させてください。","Cuối cùng, cho tôi xác nhận các điểm đã quyết và việc cần làm."]],
ls:["会議 ファシリテーション 進め方","Nghe về kỹ năng facilitation. Shadowing các câu kéo cuộc họp về chủ đề chính."],
rp:["顧客側の参加者（人事部の課長＝声が大きく話が脱線しがち、Claudeが他の参加者も適宜演じる）","給与システム導入の定例会の司会（BA）","年末調整画面の仕様確定会議（60分）。議題3つ。","課長が「そもそも今のベンダー選定が…」と大きく脱線し、別の参加者が「時間がないので早く決めて」と苛立つ。さらに残り10分で新しい論点が出る。","時間内にゴールに到達し、決定事項と宿題を明確にする。"],
n1:"聴解（voice mode）｜課題理解 5・ポイント理解 5・語彙 5"},

{sk:"合意形成・意見対立の調整",vi:"Tạo đồng thuận, điều hòa xung đột",dom:"log",
g:["共通目的への引き上げと N1：〜つつも","Tóm lại lo ngại hai bên bằng lời trung lập → đưa về mục tiêu chung → đề xuất phương án dung hòa (折衷案) → chốt 大筋合意. 「〜つつも」 (vừa…, dù…): 「締め時間を延ばしつつも、負荷を抑える」.",["締め時間を延ばしつつも、倉庫側の負荷を抑える方法を検討しませんか。","この方向で大筋合意ということで、よろしいでしょうか。"]],
s:[["双方のご懸念を整理いたしますと、営業部は締め時間の延長、倉庫部は作業負荷ということですね。","Tóm lại lo ngại của hai bên: Kinh doanh muốn kéo dài giờ chốt, Kho lo tải công việc."],
["どちらのご意見も、お客様満足という同じ目的から来ているかと思います。","Ý kiến của cả hai bên đều xuất phát từ cùng mục tiêu là sự hài lòng của khách hàng."],
["締め時間を延ばし{つつも|}、倉庫側の負荷を抑える方法はないか、検討してみませんか。","Ta thử xem có cách nào vừa kéo dài giờ chốt vừa giảm tải cho kho không."],
["例えば、当日出荷の対象を在庫品に限定するという{折衷案|せっちゅうあん}はいかがでしょうか。","Ví dụ phương án dung hòa: chỉ giao trong ngày với hàng có sẵn trong kho, thấy sao ạ."],
["この方向で{大筋|おおすじ}合意ということで、よろしいでしょうか。","Vậy ta thống nhất đại thể theo hướng này, được không ạ."],
["細部は来週までに、両部門の実務担当の方と詰めさせていただきます。","Chi tiết tôi sẽ chốt với người phụ trách thực tế của hai bộ phận trước tuần sau."]],
ls:["合意形成 会議 対立 調整","Nghe về cách điều phối xung đột trong họp. Tìm thêm 「物流 当日出荷 締め時間」."],
rp:["顧客の営業部長と倉庫部長（Claudeが二役を演じ分ける。営業部長は攻撃的、倉庫部長は頑固）","配送管理システム改修のBA（会議の進行役）","当日出荷の受注締め時間を15時から17時に延ばしたい営業部と、反対する倉庫部の調整会議。","二人が感情的になり、営業部長が「倉庫は甘えてる」と言い、倉庫部長が「じゃあ営業が箱詰めしろ」と返す。さらに双方からBAに「どっちの味方なの？」と迫られる。","中立を保ち、共通目的に引き上げて折衷案で大筋合意を取る。"],
n1:"聴解（voice mode）｜ポイント理解 6・概要理解 4・語彙 5"},

{sk:"UAT フィードバック対応",vi:"Xử lý phản hồi UAT: lỗi hay đúng spec",dom:"edu",
g:["不具合・仕様・要望の切り分け","Phản hồi UAT chia 3 loại: 不具合 (sai so với spec), 仕様どおり (đúng spec nhưng khách không muốn), 改善要望 (yêu cầu mới). Luôn hỏi 再現手順 và 期待結果 trước khi phán. N1: 「〜に反して」 (trái với): 「ご期待に反して」, 「〜とおり」.",["期待される結果は〜ということでよろしいですね。","こちらは合意済みの仕様どおりの動作でございます。"]],
s:[["ご指摘ありがとうございます。念のため、{再現|さいげん}手順を確認させてください。","Cảm ơn đã chỉ ra. Để chắc chắn, cho tôi xác nhận các bước tái hiện."],
["どの画面で、どの園児を選択したときに発生しましたでしょうか。","Lỗi xảy ra ở màn hình nào, khi chọn trẻ nào ạ?"],
["期待される結果は、退園した園児が一覧に表示されない、ということでよろしいですね。","Kết quả mong muốn là trẻ đã thôi học không hiển thị trong danh sách, đúng không ạ."],
["確認したところ、こちらは合意済みの仕様どおりの動作でございます。","Tôi đã kiểm tra, đây là hoạt động đúng theo spec đã thống nhất.","これはバグじゃないです。"],
["ただ、現場の運用に合わないということであれば、改善要望として別途検討させていただきます。","Tuy nhiên nếu không hợp với vận hành thực tế, chúng tôi sẽ xem xét riêng như một yêu cầu cải tiến."],
["仕様か不具合か判断がつかないものは、一旦{保留|ほりゅう}扱いにして、明日までに回答いたします。","Những gì chưa phân định được là spec hay lỗi, tôi tạm để treo và trả lời trước ngày mai."]],
ls:["受け入れテスト UAT ユーザー 対応","Nghe về UAT và cách làm việc với người dùng. Shadowing câu hỏi về 再現手順."],
rp:["顧客（保育園の園長、ITに詳しくないが現場目線が鋭い）","保育システムのBA","UAT中、園長から「集計の画面、退園した子が消えちゃうんだけど、バグでしょ？」と連絡。実は仕様どおり。","園長が「仕様なんて知らない、現場が困るんだから直して」と言い、さらに「前に言ったはずだけど」と過去の発言を持ち出す。","仕様どおりであることを丁寧に説明し、要望として扱う流れに合意してもらう。"],
n1:"聴解（voice mode）｜概要理解 5・即時応答 10"},

{sk:"UAT 結果報告・リリース判定",vi:"Báo cáo kết quả UAT, quyết định release",dom:"fin",
g:["条件付きリリースの言い方と N1：〜を条件に","Báo cáo: số liệu (đạt/chưa đạt) → mức ảnh hưởng của lỗi còn lại → 回避策 → đề xuất (リリース可否) → xin quyết định. 「〜を条件に」 (với điều kiện…), 「軽微」 (nhẹ), 「つきましては」 (vì vậy, mở đề xuất).",["残り5件の修正を条件に、予定どおりリリースしたいと考えております。","いずれも業務影響は軽微で、回避策がございます。"]],
s:[["UATの結果をご報告いたします。全320ケース中、315件が合格です。","Tôi xin báo kết quả UAT: 315 trên tổng 320 case đạt."],
["未解決の不具合は5件で、うち1件は振込手数料の表示に関するものです。","Còn 5 lỗi chưa xử lý, trong đó 1 lỗi về hiển thị phí chuyển khoản."],
["いずれも業務影響は{軽微|けいび}で、回避策がございます。","Tất cả đều ảnh hưởng nghiệp vụ nhẹ và có cách né."],
["つきましては、残り5件の修正を条件に、予定どおりリリースしたいと考えております。","Vì vậy, với điều kiện sửa 5 lỗi còn lại, chúng tôi muốn release đúng kế hoạch."],
["修正版は来週火曜に適用し、翌日再確認いただく計画です。","Bản sửa sẽ áp dụng thứ Ba tuần sau, kế hoạch là hôm sau anh/chị kiểm tra lại."],
["リリース{可否|かひ}について、本日中にご判断をいただけますでしょうか。","Về việc có release hay không, mong anh/chị quyết định trong hôm nay."]],
ls:["リリース判定 会議 基準","Nghe về họp quyết định release. Tìm thêm 「銀行 システム障害 振込 ニュース」 để nghe từ vựng ngân hàng."],
rp:["顧客（信用金庫の事務部・PM、慎重派。過去の障害がトラウマ）","インターネットバンキング改修のBA","リリース判定会議でUAT結果を報告し、条件付きリリースを提案する。","PMが「手数料の表示ミスは、お客様からのクレームに直結しますよね？」と懸念し、途中で「金融庁に報告が必要になったらどうするんですか」と最悪ケースを持ち出す。","リスクを過小評価せず、条件と回避策を示して判断を引き出す。"],
n1:"聴解（voice mode）｜即時応答 8・統合理解 2題 4問・語彙 3"},

{sk:"デモ・プレゼン",vi:"Demo, thuyết trình cho cấp lãnh đạo",dom:"saas",
g:["役員向けプレゼンと N1：〜に他ならない","Với lãnh đạo: kết luận (lợi ích bằng số) trước, demo sau, thời gian ngắn. Khi bị ngắt lời: 「ご質問ありがとうございます。その点は、まさにこの後ご説明する部分でございます」. 「〜に他ならない」 (chính là…, không gì khác).",["この機能こそ、現場の声から生まれたものに他なりません。","結論から申し上げますと、月次の集計作業が約半分になります。"]],
s:[["本日は、新システムの主要機能を15分でご紹介いたします。","Hôm nay tôi xin giới thiệu các chức năng chính của hệ thống mới trong 15 phút."],
["結論から申し上げますと、月次の集計作業が約半分になります。","Nói kết luận trước: công việc tổng hợp hằng tháng giảm khoảng một nửa."],
["では、実際の画面をご覧ください。","Mời quý vị xem màn hình thực tế.","画面を見てください。"],
["ご質問ありがとうございます。その点は、まさにこの後ご説明する部分でございます。","Cảm ơn câu hỏi. Điểm đó chính là phần tôi sắp giải thích."],
["この機能こそ、現場の皆様の声から生まれたものに{他|ほか}なりません。","Chức năng này không gì khác chính là được sinh ra từ tiếng nói của các anh chị ở hiện trường."],
["以上でデモを終わります。ご不明な点がございましたら、お気軽にお尋ねください。","Phần demo đến đây là hết. Có điểm nào chưa rõ xin cứ hỏi."]],
ls:["プレゼン 役員 説明 コツ","Nghe về thuyết trình cho lãnh đạo. Shadowing câu mở đầu và câu kết."],
rp:["顧客の役員（専務、忙しく、途中で遮るのが癖）","SaaS導入プロジェクトのBA（デモ担当）","本番稼働前の役員向けデモ（15分）。","専務が冒頭2分で「で、いくら浮くの？」と遮り、途中で「他社のSaaSとの違いは？」「現場は本当に使えるの？」と立て続けに聞く。","結論ファーストで、遮られても流れを取り戻し、時間内に終える。"],
n1:"聴解（voice mode）｜統合理解 2題 4問・課題理解 5・語彙 6"},

{sk:"質疑応答：答えに詰まったとき",vi:"Hỏi đáp: khi bị câu hỏi khó",dom:"api",
g:["詰まったときの型と N1：〜に限ったことではない","Không biết thì không đoán: xác nhận ý định câu hỏi → nói phần chắc chắn biết → hẹn thời hạn trả lời. 「〜に限ったことではない」 (không chỉ riêng…), 「確認の上」 (sau khi xác nhận).",["開発担当に確認の上、本日中にご回答いたします。","この問題は本システムに限ったことではございません。"]],
s:[["ご質問の意図を確認させてください。同時更新時のデータ整合性について、ということでしょうか。","Cho tôi xác nhận ý câu hỏi: là về tính nhất quán dữ liệu khi cập nhật đồng thời phải không ạ."],
["非常に{鋭|するど}いご指摘です。","Đó là một chỉ ra rất sắc bén."],
["正確にお答えしたいので、開発担当に確認の上、本日中にご回答いたします。","Để trả lời chính xác, tôi sẽ xác nhận với người phát triển và trả lời trong hôm nay.","わかりません。"],
["現時点で申し上げられるのは、APIは冪等性を担保する設計になっている、という点です。","Điều có thể nói lúc này là API được thiết kế đảm bảo tính idempotent."],
["この問題は本システムに限ったことではなく、連携全般に共通する課題かと思います。","Vấn đề này không chỉ riêng hệ thống này mà là thách thức chung của mọi tích hợp."],
["他にご懸念点はございますか。今のうちに{洗|あら}い出しておければと思います。","Còn lo ngại nào khác không ạ? Tôi muốn liệt kê hết ngay bây giờ."]],
ls:["質疑応答 答えられない 対応","Nghe cách xử lý câu hỏi khó. Tìm thêm 「API 冪等性 とは」 để nghe giải thích kỹ thuật bằng tiếng Nhật."],
rp:["顧客の技術者（基幹システム担当、細かく意地悪な質問が多い）","システム連携プロジェクトのBA","連携方式の説明会の質疑応答。","技術者が「同時更新で二重計上されたら？」「障害時の再送で順序が入れ替わったら？」とBAの専門外の質問を連発し、「BAなのに分からないんですか」と言う。","分からないことを認めつつ信頼を失わない。"],
n1:"聴解（voice mode）｜ミックス（課題・ポイント・概要・即時応答）15"},

{sk:"謝罪・障害報告（第一報）",vi:"Xin lỗi và báo cáo sự cố (bản tin đầu)",dom:"ec",
g:["第一報の5要素と謝罪の段階","Bản tin đầu: 事象 (gì), 発生時刻, 影響範囲, 暫定対応, 次回報告時刻. Chưa rõ nguyên nhân vẫn phải báo. Mức xin lỗi: 申し訳ございません < 誠に申し訳ございません < 深くお詫び申し上げます. N1: 「〜を受けて」 (tiếp nhận…, sau khi…).",["原因が判明していなくても、11時時点の状況をご報告いたします。","大変ご迷惑をおかけしており、誠に申し訳ございません。"]],
s:[["大変ご迷惑をおかけしており、誠に申し訳ございません。","Thành thật xin lỗi vì đã gây phiền phức lớn."],
["本日10時15分頃より、一部店舗のPOSで会計ができない{事象|じしょう}が発生しております。","Từ khoảng 10h15 hôm nay, đang xảy ra hiện tượng một số cửa hàng không tính tiền được trên POS."],
["現時点で影響を確認しているのは、関東地区の12店舗です。","Hiện đã xác nhận ảnh hưởng ở 12 cửa hàng khu vực Kantō."],
["原因は調査中ですが、今朝適用したマスタ更新との関連を疑っております。","Nguyên nhân đang điều tra, nhưng nghi có liên quan đến việc cập nhật master sáng nay."],
["{暫定|ざんてい}対応として、マスタを切り戻す作業を進めております。","Biện pháp tạm thời: đang rollback master."],
["次回は11時時点の状況を、原因が判明していなくてもご報告いたします。","Lần tới tôi sẽ báo tình hình lúc 11h, kể cả khi chưa rõ nguyên nhân.","原因がわかったら連絡します。"]],
ls:["システム障害 謝罪 記者会見","Nghe họp báo xin lỗi về sự cố hệ thống (ngân hàng, viễn thông). Shadowing phần mở đầu xin lỗi."],
rp:["顧客（小売チェーンの店舗運営部長、怒っているが冷静さは保つ）","POSシステム保守のBA","10時15分からPOS障害。10時40分、部長に電話で第一報を入れる。","部長が「原因も分からないのに電話してきたの？」「何店舗？売上の損失どうするの？」「社長に何て言えばいい？」と矢継ぎ早に詰める。","事実と未確定事項を分けて伝え、次回報告時刻を約束する。"],
n1:"言語知識 mini test｜語彙 7・文法 8（15分）",n1t:15},

{sk:"再発防止策の説明",vi:"Giải thích biện pháp phòng tái phát",dom:"ins",
g:["真因と仕組みで語る N1：〜を余儀なくされる","Khách Nhật ghét 精神論 (“sẽ chú ý hơn”). Phải có: 直接原因 → 真因 (vì sao cơ chế không chặn được) → 対策 bằng cơ chế (自動化, ダブルチェック, 承認) → thời hạn → cách đo hiệu quả. 「〜を余儀なくされる」 (buộc phải), 「形骸化」 (thành hình thức).",["お客様には手続きのやり直しを余儀なくさせてしまいました。","真因はレビューの仕組みが形骸化していたことにございます。"]],
s:[["今回の障害を受けて、再発防止策をご説明いたします。","Sau sự cố lần này, tôi xin giải thích biện pháp phòng tái phát."],
["直接の原因は設定ミスですが、{真因|しんいん}はレビューの仕組みが{形骸化|けいがいか}していたことにございます。","Nguyên nhân trực tiếp là sai cấu hình, nhưng nguyên nhân gốc là cơ chế review đã thành hình thức."],
["ご指摘のとおり、「注意を{徹底|てってい}する」だけでは再発は防げません。","Đúng như anh chỉ ra, chỉ “chú ý triệt để” thì không ngăn được tái phát.","今後は気をつけます。"],
["そのため、設定変更はツールで差分を自動検知し、承認なしでは適用できない仕組みに改めます。","Vì vậy, chúng tôi đổi sang cơ chế tự động phát hiện khác biệt bằng công cụ, không có phê duyệt thì không áp dụng được."],
["全ての対策は来月末までに完了させ、効果を四半期ごとにご報告いたします。","Tất cả biện pháp hoàn thành trước cuối tháng sau, và báo cáo hiệu quả mỗi quý."],
["二度とこのような事態を{招|まね}かぬよう、全社を挙げて取り組んでまいります。","Toàn công ty sẽ nỗ lực để không bao giờ gây ra tình trạng như vậy nữa."]],
ls:["再発防止策 なぜなぜ分析 書き方","Nghe về phân tích なぜなぜ và viết biện pháp phòng tái phát."],

g:["条件の聞き方と N1：〜次第・〜に応じて","Hỏi lương/đánh giá: 「差し支えなければ」, và nêu mong muốn có căn cứ (現職の水準を踏まえ). Câu hỏi ngược tốt: về vai trò 3 tháng đầu, đặc điểm người thành công, thách thức của team. Không hỏi những gì đã có trên website.",["差し支えなければ、評価制度についても伺えますでしょうか。","ご経験に応じて決定とのことですが、目安を伺えますか。"]],

{sk:"面接⑦：深掘り・圧迫質問",vi:"Phỏng vấn: bị hỏi dồn, hỏi gây áp lực",dom:"job",
g:["圧迫への型と N1：〜とは言い切れない・〜までもない","Không cãi, không xin lỗi quá: 「ご指摘のとおり〜。一方で〜」. Xin thời gian suy nghĩ: 「少し考える時間をいただいてもよろしいでしょうか」. 「〜とは言い切れない」 (không thể khẳng định là…). Giữ nhịp nói bình thường, câu ngắn.",["必ずしも不利とは言い切れないと考えております。","少し考える時間をいただいてもよろしいでしょうか。"]],

["一方で、一つの業務を深く理解したからこそ、他業界でも応用できる型を身につけたと考えております。","Mặt khác, chính vì hiểu sâu một nghiệp vụ mà tôi có được cái khung áp dụng được cho ngành khác."],
["ネイティブでない点は否定しませんが、日本語での要件定義書の作成は日常的に行っております。","Tôi không phủ nhận mình không phải người bản xứ, nhưng việc viết tài liệu định nghĩa yêu cầu bằng tiếng Nhật là hằng ngày."],
["少し考える時間をいただいてもよろしいでしょうか。","Cho tôi xin chút thời gian suy nghĩ được không ạ.","えーと、えーと…"],
["結論から申しますと、同じ状況でも私は同じ判断をすると思います。理由は二つございます。","Nói kết luận trước: trong tình huống tương tự tôi vẫn sẽ phán đoán như vậy. Có hai lý do."],
["厳しいご質問をいただき、改めて自分の課題を整理する機会になりました。","Câu hỏi khó của anh là dịp để tôi sắp xếp lại các thách thức của bản thân."]],

{sk:"稟議・投資対効果の説明",vi:"Trình bày đề xuất đầu tư (稟議) và hiệu quả đầu tư",dom:"acc",
g:["稟議の論理と N1：〜をもってすれば・〜に見合う","Đề xuất với cấp quản lý Nhật cần: 現状の損失 (bằng số) → 投資額 → 回収期間 → リスク → 代替案. 「〜に見合う」 (tương xứng với): 「投資に見合う効果」. 「〜をもってすれば」 (nếu dùng… thì): 「現行の体制をもってすれば、半年で回収可能です」.",["投資に見合う効果が得られるかが論点かと存じます。","現行の体制をもってすれば、約14か月で回収できる見込みです。"]],
s:[["本件は、請求書処理の自動化に関する{稟議|りんぎ}でございます。","Đây là tờ trình về việc tự động hóa xử lý hóa đơn."],
["現状、月に約200時間が{手入力|ていにゅうりょく}と確認作業に費やされております。","Hiện mỗi tháng khoảng 200 giờ bị tiêu tốn cho nhập tay và kiểm tra."],
["初期投資は約800万円で、{回収|かいしゅう}期間は14か月程度を見込んでおります。","Đầu tư ban đầu khoảng 8 triệu yên, thời gian hoàn vốn dự kiến khoảng 14 tháng."],
["試算は{保守的|ほしゅてき}な前提に基づいており、効果を{過大|かだい}に見積もってはおりません。","Ước tính dựa trên tiền đề thận trọng, không đánh giá hiệu quả quá cao.","絶対に効果があります。"],
["効果が出なかった場合に備え、半年後に{継続|けいぞく}可否を判断する{関門|かんもん}を設けます。","Để phòng trường hợp không hiệu quả, chúng tôi đặt mốc đánh giá có tiếp tục hay không sau nửa năm."],
["つきましては、まず3か月の{試行|しこう}についてご承認を{賜|たまわ}りたく存じます。","Vì vậy, kính mong được phê duyệt trước cho giai đoạn thử 3 tháng."]],

{sk:"経営層へのインタビュー",vi:"Phỏng vấn cấp lãnh đạo về bài toán kinh doanh",dom:"mfg",
g:["役員への質問の作法と N1：〜ともなれば・〜あっての","Với lãnh đạo: xin ít thời gian, hỏi về 経営課題 (không hỏi chi tiết thao tác), xác nhận ưu tiên. 「〜ともなれば」 (khi đã đến mức…): 「海外拠点ともなれば」. 「〜あっての」 (có… thì mới có…): 「現場あっての改革」.",["海外拠点ともなれば、管理の難しさも増すかと存じます。","現場の理解あっての改革だと考えております。"]],
s:[["本日は貴重なお時間をいただき、ありがとうございます。30分ほどで{伺|うかが}えればと存じます。","Cảm ơn ngài đã dành thời gian quý báu. Tôi xin được hỏi trong khoảng 30 phút."],
["3年後、どのような会社になっていたいとお考えでしょうか。","Ngài muốn công ty trở thành như thế nào sau 3 năm nữa?"],
["その実現にあたって、一番の{足|あし}かせになっているのは何でしょうか。","Để thực hiện điều đó, rào cản lớn nhất là gì ạ?"],
["現場の方々からは在庫の{見える化|みえるか}が課題だと伺いましたが、経営のお立場からはいかがでしょうか。","Từ hiện trường tôi nghe vấn đề là trực quan hóa tồn kho; từ góc độ quản trị thì ngài thấy sao ạ."],
["{僭越|せんえつ}ながら、現場と経営とで優先度に{温度差|おんどさ}があるように感じました。","Xin mạo muội, tôi cảm thấy giữa hiện trường và lãnh đạo có độ chênh về mức ưu tiên.","現場と社長の意見が違います。"],
["本日伺った内容をもとに、優先課題を3つに{絞|しぼ}ってご報告いたします。","Dựa trên nội dung hôm nay, tôi sẽ thu gọn thành 3 vấn đề ưu tiên và báo cáo lại."]],
ls:["経営者 インタビュー 製造業 DX","Nghe phỏng vấn giám đốc doanh nghiệp sản xuất. Chú ý cách người hỏi dẫn dắt và cách giám đốc nói về chiến lược."],
rp:["顧客の代表取締役（60代、創業家出身、話が大きく抽象的）","生産管理システム刷新のBA","社長への30分インタビュー。経営課題と優先順位を聞き出す。","社長が「とにかくDXだよ」「細かいことは部長に聞いて」と抽象論に終始し、途中で「君はうちの会社をどう思う？」と逆に聞いてくる。","抽象的な発言から具体的な経営課題と優先順位を引き出す。"],

{sk:"業務改革（BPR）の必要性を説く",vi:"Thuyết phục cải cách nghiệp vụ, không chỉ thay hệ thống",dom:"gov",
g:["「システムに合わせる」説得と N1：〜ずにはおかない・〜を余儀なくされる","Người Nhật thường muốn giữ nguyên nghiệp vụ và “bắt hệ thống theo”. BA cần chỉ ra chi phí của tùy biến. 「〜を余儀なくされる」 (buộc phải): 「改修を余儀なくされる」. 「〜ずにはおかない」 (chắc chắn sẽ gây ra…).",["現行業務をそのまま再現すれば、毎年の改修を余儀なくされます。","このままでは現場の負担を増やさずにはおかないでしょう。"]],
s:[["今回の目的は、システムの入れ替えではなく、業務そのものを見直すことにあると考えております。","Tôi cho rằng mục đích lần này không phải thay hệ thống, mà là xem lại chính nghiệp vụ."],
["現行の{帳票|ちょうひょう}を{一字一句|いちじいっく}再現しますと、標準化の効果がほぼ失われてしまいます。","Nếu tái hiện y nguyên từng chữ biểu mẫu hiện tại, hiệu quả chuẩn hóa gần như mất hết."],
["{独自|どくじ}の改修を重ねると、制度改正のたびに改修を{余儀|よぎ}なくされます。","Nếu cứ chồng thêm tùy biến riêng, mỗi lần sửa chế độ lại buộc phải sửa hệ thống."],
["{慣|な}れたやり方を変えるご負担は、重々承知しております。","Tôi hiểu rất rõ gánh nặng khi phải thay đổi cách làm đã quen."],
["他の自治体でも、最初は{抵抗|ていこう}がありましたが、半年で定着した事例がございます。","Ở các địa phương khác ban đầu cũng có phản đối, nhưng có trường hợp sau nửa năm đã ổn định."],
["業務を変える部分と、どうしても残す部分を、一緒に{線引|せんび}きさせていただけませんか。","Xin được cùng ngài vạch ranh giới phần thay đổi nghiệp vụ và phần nhất định phải giữ."]],
ls:["BPR 業務改革 とは 事例","Nghe giải thích BPR và ví dụ. Tìm thêm 「Fit to Standard 自治体」."],

{sk:"AI活用の提案と期待値調整",vi:"Đề xuất ứng dụng AI và điều chỉnh kỳ vọng",dom:"ai",
g:["過度な期待の抑え方と N1：〜とは限らない・〜に越したことはない","Khi khách kỳ vọng AI “làm được hết”: công nhận tiềm năng → nói rõ giới hạn (精度, データ品質) → đề xuất PoC nhỏ có tiêu chí đánh giá. 「必ずしも〜とは限りません」, 「精度は高いに越したことはありませんが」.",["AIを導入すれば必ずしも工数が減るとは限りません。","精度は高いに越したことはありませんが、まずは業務で使える水準を定義しましょう。"]],
s:[["生成AIの活用によって、問い合わせ対応の{一次回答|いちじかいとう}を効率化できる可能性がございます。","Nhờ ứng dụng AI tạo sinh, có khả năng hiệu quả hóa phần trả lời sơ bộ cho các câu hỏi."],
["ただし、AIの回答が常に正しいとは限りませんので、人による確認の{工程|こうてい}は残す必要がございます。","Tuy nhiên câu trả lời của AI không phải lúc nào cũng đúng, nên cần giữ khâu con người kiểm tra."],
["精度を{左右|さゆう}するのは、モデルよりもむしろ社内データの品質です。","Điều quyết định độ chính xác, đúng hơn là chất lượng dữ liệu nội bộ chứ không phải mô hình."],
["まずは{概念実証|がいねんじっしょう}として、1部署・2か月に限定して試すことをご提案いたします。","Trước hết tôi đề xuất làm PoC, giới hạn 1 bộ phận trong 2 tháng."],
["評価の{基準|きじゅん}は、正答率と、担当者の対応時間の二つでいかがでしょうか。","Tiêu chí đánh giá là tỷ lệ trả lời đúng và thời gian xử lý của nhân viên, được không ạ."],
["{全社展開|ぜんしゃてんかい}は、効果が確認できた段階で改めてご判断いただければと存じます。","Việc triển khai toàn công ty, xin quyết định lại khi đã xác nhận được hiệu quả.","すぐに全社で使えます。"]],
ls:["生成AI 業務活用 事例 課題","Nghe về ứng dụng AI tạo sinh trong doanh nghiệp Nhật. Ghi lại 5 thuật ngữ (精度, 学習データ, ハルシネーション…)."],
rp:["顧客の常務（60代、AIのニュースに影響され期待が大きい）","問い合わせ業務改善のBA","常務から「AIで問い合わせ対応を全部自動化したい。来月から」と言われる打ち合わせ。","常務が「他社はもうやっている」「人はいらなくなるんでしょ？」と過大な期待を語り、懸念を伝えると「君は後ろ向きだね」と不機嫌になる。","相手の意欲を損なわずに現実的な期待値とPoCに着地させる。"],
n1:"読解｜長文（評論）1題 4問・情報検索 1題 3問・語彙 8"},

{sk:"ベンダー選定・RFPの説明",vi:"Giải thích RFP và tiêu chí chọn nhà cung cấp",dom:"ins",
g:["中立な評価の言い方と N1：〜を踏まえ・〜如何によらず","BA bên khách hoặc tư vấn: giải thích tiêu chí đánh giá công bằng, không thiên vị. 「価格の多寡のみならず」, 「〜を総合的に勘案し」. Khi bị hỏi “nên chọn ai?”: nêu điểm mạnh/rủi ro từng bên, để người ra quyết định chọn.",["価格の多寡のみならず、保守体制を総合的に勘案して評価いたしました。","各社の提案を踏まえ、評価結果を整理いたしました。"]],
s:[["今回のRFPでは、機能要件だけでなく、移行と保守の体制も評価の対象としております。","Trong RFP lần này, không chỉ yêu cầu chức năng mà cả nhân sự chuyển đổi và bảo trì cũng là đối tượng đánh giá."],
["評価項目と{配点|はいてん}は、事前に関係部署と合意したものでございます。","Các hạng mục đánh giá và thang điểm đã thống nhất trước với các bộ phận liên quan."],
["A社は価格面で優位ですが、{保険業界|ほけんぎょうかい}での導入実績が少ない点がリスクです。","Công ty A có lợi thế về giá, nhưng rủi ro là ít thành tích triển khai trong ngành bảo hiểm."],
["B社は実績が豊富な一方、カスタマイズの{自由度|じゆうど}が低く、運用の見直しが前提となります。","Công ty B nhiều thành tích, nhưng độ tự do tùy biến thấp, nên tiền đề là phải xem lại vận hành."],
["どちらを選ぶべきかは、{何|なに}を最も重視されるか次第かと存じます。","Nên chọn bên nào, tôi nghĩ tùy vào việc quý công ty coi trọng điều gì nhất.","B社がいいと思います。"],
["評価の{経緯|けいい}は、監査にも耐えられるよう記録に残しております。","Quá trình đánh giá được lưu hồ sơ để có thể đáp ứng cả kiểm toán."]],
ls:["RFP 提案依頼書 ベンダー選定","Nghe về quy trình RFP và chọn vendor. Tìm thêm 「保険 基幹システム 刷新」."],
rp:["顧客の情報システム部長（慎重、社内政治に敏感）","ベンダー選定を支援するBA（コンサル側）","2社の提案を評価した結果を報告する。","部長が「で、君ならどっち？」と結論を迫り、さらに「実は役員がA社推しなんだよね」と打ち明け、評価結果の見直しをほのめかす。","中立性を保ちながら、判断材料を明確に示す。"],
n1:"聴解（voice mode）｜統合理解 2題 4問・ポイント理解 5・即時応答 6"},

{sk:"面接⑩：キャリアビジョン",vi:"Phỏng vấn: tầm nhìn sự nghiệp, định hướng quản lý",dom:"job",
g:["将来像の語り方と N1：〜ゆくゆくは・〜を通じて","Nói tầm nhìn: ngắn hạn (1–2 năm) → trung hạn (3–5 năm) → liên hệ với công ty ứng tuyển. 「ゆくゆくは」 (về lâu dài), 「〜を通じて」 (thông qua). Tránh nói như thể sẽ sớm rời đi.",["ゆくゆくは、BAチームを率いる立場を目指したいと考えております。","案件を通じて、業界知識を体系的に身につけたいと思います。"]],
s:[["入社後1〜2年は、まず御社の業務とお客様を深く理解することに集中したいと考えております。","1–2 năm đầu sau khi vào, tôi muốn tập trung hiểu sâu nghiệp vụ và khách hàng của quý công ty."],
["3年後には、複数業界の上流工程をリードできるBAになっていたいです。","Sau 3 năm, tôi muốn trở thành BA có thể dẫn dắt công đoạn thượng nguồn của nhiều ngành."],
["ゆくゆくは、後進の育成にも{携|たずさ}わりたいと考えております。","Về lâu dài, tôi cũng muốn tham gia đào tạo thế hệ sau."],
["マネジメントにも関心はございますが、現場の{勘所|かんどころ}を失わない形で関わりたいです。","Tôi cũng quan tâm đến quản lý, nhưng muốn tham gia theo cách không đánh mất cảm nhận thực tế."],
["その意味で、御社の{専門職|せんもんしょく}コースには大変魅力を感じております。","Theo nghĩa đó, tôi thấy lộ trình chuyên gia của quý công ty rất hấp dẫn."],
["長く腰を{据|す}えて、御社の成長に貢献したいと考えております。","Tôi muốn gắn bó lâu dài và đóng góp vào sự phát triển của quý công ty.","いい会社があれば、また転職するかもしれません。"]],
ls:["面接 キャリアプラン 5年後 答え方","Nghe cách trả lời “5 năm sau bạn muốn thế nào”. Chú ý cách liên hệ với công ty ứng tuyển."],
rp:["面接官（大手SIerの人事部長＋事業部長、最終面接）","転職希望のBA","最終面接。キャリアビジョンを聞かれる。","事業部長が「うちではBAは管理職になれないけど、それでもいい？」「3年後に辞めない保証は？」と揺さぶる。","一貫したキャリアの軸を示し、会社との接点を具体的に語る。"],
n1:"言語知識 本番形式｜語彙 7・文法 8（12分）",n1t:12},
