{sk:"マルチベンダーの責任分界",vi:"Phân định trách nhiệm giữa nhiều nhà cung cấp",dom:"api",
g:["責任分界の議論と N1：〜をよそに・〜に即して","Khi sự cố nằm giữa hai vendor: không đổ lỗi, đưa về sự thật (ログ, インターフェース仕様), đề xuất cách xác định nguyên nhân chung. 「インターフェース仕様に即して」 (dựa sát theo spec), 「〜をよそに」 (mặc kệ…).",["インターフェース仕様に即して、事実を一つずつ確認させてください。","お客様の不安をよそに、責任の押し付け合いをしている場合ではございません。"]],
s:[["まず、どちらの責任かという話の前に、事実関係を{整理|せいり}させてください。","Trước khi bàn trách nhiệm của bên nào, cho tôi sắp xếp lại các sự thật."],
["ログを見る限り、データ自体は{連携先|れんけいさき}に正常に送信されております。","Theo log, bản thân dữ liệu đã được gửi bình thường đến hệ thống đối tác."],
["インターフェース仕様書には、文字コードの{規定|きてい}がございませんでした。","Trong tài liệu spec giao diện không có quy định về mã ký tự."],
["つまり、どちらかの誤りというより、仕様の{空白|くうはく}だったと考えております。","Tức là, tôi cho rằng đây là khoảng trống của spec chứ không phải lỗi của bên nào.","B社のミスです。"],
["{暫定|ざんてい}対応は弊社で行い、{恒久|こうきゅう}対応は三者で協議させていただけませんか。","Biện pháp tạm thời chúng tôi làm, còn biện pháp lâu dài xin để ba bên cùng thảo luận."],
["今後は、仕様の変更時に三者で確認する場を{設|もう}けることをご提案いたします。","Từ nay, tôi đề xuất lập buổi xác nhận ba bên mỗi khi thay đổi spec."]],
ls:["マルチベンダー 障害 責任 切り分け","Nghe về quản lý nhiều vendor và phân định sự cố. Ghi lại 5 cụm từ về 責任分界."],
rp:["他社ベンダーのPM（強気で、自社の非を認めない）と顧客の情シス課長（Claudeが二役）","連携プロジェクトのBA（自社）","本番で連携データの文字化けが発生。原因がどちら側か不明。","他社PMが「うちは仕様どおり。そっちの受信処理の問題でしょう」と言い切り、課長は「どっちでもいいから今日中に直して」と苛立つ。","責任追及より事実と解決を優先させ、三者の合意を作る。"],
n1:"文法｜文章の文法（長め）2題 10問・並べ替え 5"},

{sk:"顧客社内の対立の仲裁",vi:"Đứng giữa xung đột nội bộ của khách hàng",dom:"hr",
g:["中立の保ち方と N1：〜はおろか・〜なりとも","BA không phải người quyết định nội bộ khách. Vai trò: làm rõ lập luận hai bên, đưa dữ liệu, đề xuất người có quyền quyết định (決裁者). 「〜はおろか」 (chứ đừng nói…), 「少しなりとも」 (dù chỉ một chút).",["このままでは、来月のリリースはおろか、年内の稼働も危ぶまれます。","少しなりとも、判断材料のお役に立てればと思います。"]],
s:[["私どもはどちらかの立場に立つものではございません。","Chúng tôi không đứng về phía bên nào."],
["人事部としては{法令遵守|ほうれいじゅんしゅ}、各事業部としては現場の柔軟性、というご主張と理解しております。","Tôi hiểu chủ trương của Nhân sự là tuân thủ pháp luật, còn các bộ phận kinh doanh là sự linh hoạt ở hiện trường."],
["双方のご主張を、影響とコストの{観点|かんてん}で並べてみました。","Tôi đã đặt hai chủ trương cạnh nhau theo góc độ ảnh hưởng và chi phí."],
["このまま決まらないと、来月のリリースはおろか、年内の{稼働|かどう}も危うくなります。","Nếu cứ không quyết, đừng nói release tháng sau, ngay cả vận hành trong năm cũng nguy."],
["最終的なご判断は、{決裁権|けっさいけん}をお持ちの本部長にお願いするのが{筋|すじ}かと存じます。","Tôi nghĩ hợp lẽ là nhờ Giám đốc khối, người có quyền phê duyệt, đưa ra quyết định cuối cùng."],
["判断材料は、明日中に一枚にまとめてお送りいたします。","Tài liệu phục vụ quyết định, tôi sẽ tóm vào một trang và gửi trong ngày mai."]],
ls:["社内調整 部門間 対立 解決","Nghe về điều phối xung đột giữa các phòng ban. Tìm thêm 「勤怠管理 働き方改革 法令」."],
rp:["顧客の人事部長と営業本部長（Claudeが二役。互いに譲らない）","勤怠システム導入のBA","打刻ルールを全社統一したい人事と、営業の直行直帰を例外にしたい営業本部が対立している会議。","二人がBAに「ベンダーとしてどっちが正しいか言ってよ」と迫り、さらに営業本部長が「人事は現場を知らない」と感情的になる。","中立を保ち、論点を整理して決裁者の判断につなげる。"],
n1:"読解｜中文 3題 9問・語彙 6"},

{sk:"契約形態と責任範囲",vi:"Bàn về loại hợp đồng (請負/準委任) và phạm vi trách nhiệm",dom:"saas",
g:["契約の話し方と N1：〜とあっては・〜までもない","請負 = cam kết hoàn thành sản phẩm; 準委任 = cam kết thực hiện công việc (không cam kết kết quả). BA phải nói rõ hệ quả với 瑕疵/契約不適合. 「〜とあっては」 (nếu đã là…), 「〜までもなく」 (không cần đến…).",["本番障害とあっては、契約形態にかかわらず全力で対応いたします。","申し上げるまでもなく、品質への責任は変わりません。"]],
s:[["本フェーズは{準委任|じゅんいにん}契約ですので、成果物の完成をお約束する形ではございません。","Giai đoạn này là hợp đồng chuẩn ủy thác, nên không phải hình thức cam kết hoàn thành sản phẩm."],
["一方、開発フェーズは{請負|うけおい}契約となり、{契約不適合|けいやくふてきごう}の責任を負います。","Ngược lại, giai đoạn phát triển là hợp đồng nhận khoán, chúng tôi chịu trách nhiệm về sự không phù hợp hợp đồng."],
["要件の{確定|かくてい}が遅れた場合の扱いについて、事前に合意しておければと存じます。","Tôi muốn thống nhất trước về cách xử lý khi việc chốt yêu cầu bị chậm."],
["申し上げるまでもなく、品質に対する責任感は契約形態によって変わるものではございません。","Không cần phải nói, tinh thần trách nhiệm về chất lượng không thay đổi theo loại hợp đồng."],
["ただ、範囲外の作業を{無償|むしょう}でお受けすることは、いたしかねます。","Tuy nhiên, việc nhận làm miễn phí công việc ngoài phạm vi thì chúng tôi không thể."],
["契約の解釈については、念のため{法務|ほうむ}にも確認のうえご回答いたします。","Về cách hiểu hợp đồng, để chắc chắn tôi sẽ xác nhận với bộ phận pháp chế rồi trả lời.","たぶん大丈夫です。"]],
ls:["請負 準委任 違い IT","Nghe giải thích khác biệt 請負/準委任. Ghi lại 3 thuật ngữ pháp lý."],
rp:["顧客の購買・法務担当（理詰めで細かい）","SaaS導入のBA","要件定義が遅れ、開発スケジュールに影響。費用負担について協議する。","担当者が「準委任でも結果が出なかったら払う意味がない」「遅延は御社のヒアリング不足が原因ですよね」と責任を押し付けてくる。","契約上の整理を冷静に説明し、関係を壊さずに落としどころを探る。"],
n1:"聴解（voice mode）｜概要理解 5・即時応答 10（速め）"},

{sk:"セキュリティ・監査要件の説明",vi:"Giải thích yêu cầu bảo mật và kiểm toán",dom:"fin",
g:["リスクの伝え方と N1：〜ともすれば・〜を禁じ得ない","Với ngân hàng/kiểm toán: nói bằng cơ chế, tiêu chuẩn (FISC, 権限分離, ログ保全) chứ không nói “an toàn mà”. 「ともすれば」 (dễ có xu hướng…): 「ともすれば利便性が優先されがちです」.",["ともすれば利便性が優先されがちですが、権限の分離は譲れません。","監査の観点から、操作ログは5年間保全いたします。"]],
s:[["本システムでは、{権限|けんげん}の分離を前提に設計しております。","Hệ thống này được thiết kế với tiền đề phân tách quyền hạn."],
["承認者と{起票者|きひょうしゃ}が同一人物になることは、仕組み上できません。","Về cơ chế, người lập phiếu và người phê duyệt không thể là cùng một người."],
["すべての操作ログは{改ざん|かいざん}できない形で5年間保全いたします。","Toàn bộ log thao tác được lưu giữ 5 năm theo cách không thể sửa đổi."],
["ともすれば利便性が優先されがちですが、この点は{譲|ゆず}れない要件と考えております。","Dễ có xu hướng ưu tiên sự tiện lợi, nhưng chúng tôi coi đây là yêu cầu không thể nhượng bộ."],
["{脆弱性|ぜいじゃくせい}診断は、リリース前と年1回、第三者機関に{依頼|いらい}いたします。","Kiểm tra lỗ hổng sẽ nhờ tổ chức bên thứ ba thực hiện trước release và mỗi năm một lần."],
["監査でのご質問に備え、{証跡|しょうせき}の一覧を別紙にまとめております。","Để chuẩn bị cho câu hỏi kiểm toán, danh sách bằng chứng đã được tổng hợp ở tài liệu riêng.","たぶん安全です。"]],
ls:["FISC 安全対策基準 解説","Nghe giải thích tiêu chuẩn an toàn hệ thống ngân hàng. Tìm thêm 「内部監査 IT統制」."],
rp:["顧客の内部監査室長（元銀行員、厳格、細部まで突く）","融資システム刷新のBA","監査室によるシステム監査の事前ヒアリング。","室長が「管理者権限を持つ人は何人？その人が不正をしたら？」「ログを消せる人はいないと証明できますか」と追及し、回答の矛盾を指摘してくる。","仕組みと証跡で答え、わからない点は誤魔化さず持ち帰る。"],
n1:"読解｜長文 1題 4問・主張理解 1題 4問・語彙 7（20分）",n1t:20},

{sk:"障害の最終報告と訪問謝罪",vi:"Báo cáo cuối về sự cố và đến xin lỗi trực tiếp",dom:"med",
g:["訪問謝罪の構成と N1：〜に至った・〜をもって","Thứ tự: 謝罪 → 経緯 (時系列) → 原因 (真因) → 影響 → 再発防止策 → 再度の謝罪. 「〜に至った経緯」 (diễn biến dẫn đến…), 「本日をもって」. Không biện minh trước khi xin lỗi.",["障害の発生に至った経緯をご説明いたします。","本日をもって、すべての対策が完了いたしました。"]],
s:[["このたびは、多大なるご迷惑をおかけし、{誠|まこと}に申し訳ございませんでした。","Lần này đã gây phiền phức lớn, chúng tôi thành thật xin lỗi."],
["まず、障害の発生に{至|いた}った経緯を、時系列でご説明いたします。","Trước hết, tôi xin trình bày theo trình tự thời gian diễn biến dẫn đến sự cố."],
["影響は、予約患者様約150名、外来の待ち時間が最大2時間延びたことでございます。","Ảnh hưởng là khoảng 150 bệnh nhân đặt lịch, thời gian chờ khám ngoại trú kéo dài tối đa 2 giờ."],
["{真因|しんいん}は、負荷試験の想定が実際の{繁忙日|はんぼうび}を下回っていたことにございます。","Nguyên nhân gốc là giả định của kiểm thử tải thấp hơn ngày cao điểm thực tế."],
["患者様と現場の皆様にご負担をおかけしたことを、重く受け止めております。","Chúng tôi tiếp nhận một cách nghiêm túc việc đã gây gánh nặng cho bệnh nhân và nhân viên.","システムの問題なので仕方なかったです。"],
["本日をもって対策はすべて完了しましたが、今後3か月は{監視|かんし}を強化いたします。","Đến hôm nay mọi biện pháp đã hoàn tất, nhưng 3 tháng tới chúng tôi sẽ tăng cường giám sát."]],
ls:["障害報告書 訪問 謝罪 マナー","Nghe về cách đi xin lỗi khách hàng trực tiếp. Shadowing câu mở đầu và câu kết."],
rp:["顧客の病院長と事務長（Claudeが二役。院長は静かに怒り、事務長は感情的）","予約・受付システム保守のBA（上司と同行）","先週の大規模障害について、病院を訪問して最終報告と謝罪を行う。","院長が「患者さんにとって2時間の重みがわかりますか」と静かに問い、事務長が「契約を見直すことも考えています」と言う。","心からの謝罪と事実の説明を両立し、信頼回復の一歩をつくる。"],
n1:"文字・語彙｜紛らわしい語の総ざらい 15"},

{sk:"面接⑪：外国籍BAとしての価値",vi:"Phỏng vấn: giá trị và lo ngại khi là BA người nước ngoài",dom:"job",
g:["懸念を強みに変える型と N1：〜ならではの・〜にひきかえ","Người phỏng vấn có thể lo: tiếng Nhật, văn hóa, gắn bó lâu dài. Trả lời: thừa nhận lo ngại → dữ liệu/kinh nghiệm phản chứng → giá trị riêng (〜ならではの). 「〜にひきかえ」 (trái ngược với…).",["日越両方の現場を知る私ならではの視点で貢献できると考えております。","以前の私にひきかえ、今では日本語で要件定義書を書くことに抵抗はございません。"]],
s:[["日本語での{細|こま}かなニュアンスについて、ご懸念があるのは当然かと存じます。","Việc quý công ty lo ngại về sắc thái tinh tế trong tiếng Nhật là điều đương nhiên."],
["現在、要件定義書や議事録はすべて日本語で作成し、お客様から修正を受けることはほとんどございません。","Hiện tôi viết toàn bộ tài liệu yêu cầu và biên bản bằng tiếng Nhật, hầu như không bị khách sửa."],
["日越両方の開発現場を知る、私ならではの視点で貢献できると考えております。","Tôi nghĩ mình có thể đóng góp bằng góc nhìn riêng của người hiểu hiện trường phát triển cả Nhật và Việt."],
["オフショアとの{橋渡|はしわた}しで生じる{認識齟齬|にんしきそご}を、早い段階で防げます。","Tôi có thể ngăn sớm những lệch nhận thức phát sinh khi làm cầu nối với offshore."],
["日本での生活基盤も整っており、長期的に働く{所存|しょぞん}でございます。","Nền tảng cuộc sống ở Nhật của tôi đã ổn định, tôi có ý định làm việc lâu dài."],
["分からない言葉は、その場で確認する習慣を{徹底|てってい}しております。","Tôi luôn duy trì thói quen xác nhận ngay những từ chưa hiểu.","分からなくても大丈夫です。"]],
ls:["外国人 採用 面接 質問 懸念","Nghe về những lo ngại khi tuyển người nước ngoài. Chuẩn bị câu trả lời cho từng lo ngại."],
rp:["面接官（日系大手の部長、本音ベースで遠慮なく聞く）","転職希望のBA","二次面接。外国籍であることに関する懸念を率直に聞かれる。","部長が「正直、お客様の中には外国人を嫌がる人もいるけど、どうする？」「いずれ国に帰るんでしょ？」と踏み込んだ質問をする。","感情的にならず、事実と価値で懸念を払拭する。"],
n1:"総合 mini test｜語彙 4・文法 4・読解 4・聴解 3（25分）",n1t:25},

{sk:"本音と建前を読み取る",vi:"Đọc ý thật sau lời nói khéo của người Nhật",dom:"re",
g:["曖昧表現の真意と N1：〜ともなく・〜でもあるまい","「前向きに検討します」「持ち帰らせてください」「難しいかもしれません」 thường là từ chối mềm. BA cần xác nhận lại bằng câu hỏi không gây khó xử: 「差し支えなければ、ご懸念の点を伺えますか」. 「〜でもあるまい」 (không đến mức…).",["今さら全面的に見直すわけでもあるまいし、まずは懸念点を伺いましょう。","「検討します」が、必ずしも前向きな意味とは限りません。"]],
s:[["「前向きに検討します」というお言葉、ありがとうございます。","Cảm ơn ngài đã nói sẽ “cân nhắc tích cực”."],
["差し{支|つか}えなければ、現時点で{引|ひ}っかかっている点を伺えますでしょうか。","Nếu không phiền, cho tôi hỏi hiện tại ngài đang vướng ở điểm nào ạ."],
["もしご予算の面でしたら、範囲を絞った案もご用意できます。","Nếu là về ngân sách, chúng tôi có thể chuẩn bị phương án thu hẹp phạm vi."],
["社内でご説明いただく際の資料が必要でしたら、こちらで作成いたします。","Nếu cần tài liệu để ngài giải thích trong nội bộ, chúng tôi sẽ soạn."],
["もし今回は見送りということでしたら、{率直|そっちょく}に{仰|おっしゃ}っていただけると助かります。","Nếu lần này ngài quyết định không tiến hành, nói thẳng cho chúng tôi thì rất quý.","はっきり言ってください。"],
["いずれにしても、次回いつ頃ご連絡を差し上げればよろしいでしょうか。","Dù thế nào, lần tới tôi nên liên lạc lại vào khoảng khi nào ạ."]],
ls:["日本人 本音 建前 ビジネス 曖昧","Nghe về văn hóa 本音・建前 trong kinh doanh. Ghi lại 5 cách nói “từ chối mềm”."],
rp:["顧客（不動産会社の部長、穏やかで決して「NO」と言わない）","賃貸管理システム提案のBA","提案から1か月後のフォロー訪問。話は和やかだが進展がない。","部長が「いい提案だと思いますよ」「上とも相談してみます」と繰り返すが、実は競合に傾いている。途中で「最近は他社さんもいろいろ来てましてね」とほのめかす。","建前の裏にある本当の懸念を、角を立てずに引き出す。"],

{sk:"根回し：会議前の合意づくり",vi:"Nemawashi: vận động đồng thuận trước cuộc họp",dom:"gov",
g:["根回しの作法と N1：〜に先駆けて・〜べからざる","Trước họp lớn, gặp riêng từng người có ảnh hưởng: chia sẻ trước nội dung, nghe lo ngại, điều chỉnh đề xuất. 「会議に先駆けて」 (đi trước cuộc họp), 「欠くべからざる」 (không thể thiếu, văn trang trọng).",["会議に先駆けて、課長のご意見を伺いたく参りました。","この点は、計画に欠くべからざる要素だと考えております。"]],
s:[["来週の{庁内|ちょうない}会議に先駆けて、事前にご相談に参りました。","Trước cuộc họp nội bộ tuần sau, tôi đến để trao đổi trước với ngài."],
["{資料|しりょう}の{叩|たた}き台をお持ちしましたので、率直なご意見をいただけますか。","Tôi mang bản nháp tài liệu đến, xin ngài cho ý kiến thẳng thắn."],
["会議の場で初めてお聞きになるよりは、と思いまして。","Tôi nghĩ tốt hơn là ngài không phải lần đầu nghe ở cuộc họp."],
["ご懸念の点は、資料に反映したうえで、改めてお見せいたします。","Những điểm ngài lo ngại, tôi sẽ phản ánh vào tài liệu rồi trình lại."],
["当日は、課長からも一言いただけますと、議論がスムーズに進むかと存じます。","Hôm đó nếu ngài nói một lời ủng hộ, tôi nghĩ thảo luận sẽ suôn sẻ hơn.","会議で味方してください。"],
["他の課の皆様にも、同様にご説明に回る予定でございます。","Tôi cũng dự định đi giải thích tương tự với các phòng khác."]],
ls:["根回し 意味 やり方 ビジネス","Nghe về 根回し và cách làm. Chú ý những câu dùng khi xin gặp riêng."],
rp:["顧客（市役所の財政課長、予算権限を持つ実力者。会議で反対しがち）","電子申請システム拡張のBA","来週の庁内会議で追加予算を提案する前に、財政課長に根回しに行く。","課長が「会議の前に来るなんて、うまくやろうとしてるね」と皮肉を言い、「この金額じゃ通らないよ」と条件を出す。","警戒を解き、懸念を聞き出して提案に反映し、当日の協力を得る。"],
n1:"文法｜敬語・待遇表現を含む形式判断 15"},

{sk:"上司の代理で会議に出る",vi:"Thay mặt cấp trên dự họp",dom:"ec",
g:["代理出席の言い方と N1：〜に代わって・〜かねない","Nói rõ phạm vi quyền hạn: điều gì mình quyết được, điều gì phải mang về. 「部長に代わりまして」, 「私の一存では決めかねますので」 (không thể tự quyết). Tránh hứa vượt quyền: 「〜と約束しかねない」 rủi ro.",["本日は部長に代わりまして、私が出席させていただきます。","この件は私の一存では決めかねますので、持ち帰らせてください。"]],

["田中からは、本件について{一任|いちにん}されている範囲がございますので、先に共有させてください。","Tôi được trưởng phòng Tanaka ủy quyền trong một phạm vi về việc này, xin chia sẻ trước."],
["スケジュールの調整までは、私の{判断|はんだん}でお答えできます。","Đến mức điều chỉnh lịch, tôi có thể trả lời theo phán đoán của mình."],
["一方、費用に関わる部分は、私の{一存|いちぞん}では決めかねます。","Mặt khác, phần liên quan đến chi phí thì tôi không thể tự quyết.","大丈夫です、やります。"],
["本日中に田中に報告し、明日の午前中までにご回答いたします。","Trong hôm nay tôi sẽ báo cáo trưởng phòng Tanaka và trả lời trước trưa mai."],
["田中からも、くれぐれもよろしくとのことでございます。","Trưởng phòng Tanaka cũng gửi lời hỏi thăm trân trọng."]],
ls:["代理出席 会議 マナー 挨拶","Nghe cách chào và cách nói khi dự họp thay sếp."],
rp:["顧客（EC事業部長、せっかちで即決を求める）","ECリニューアルのBA（上司の代理）","上司が急病で欠席。代理で定例会に出席する。","事業部長が「田中さんいないなら、あなたが決めて。今日決めないと間に合わない」と、追加機能と費用の即決を迫る。","権限の範囲を明確にし、決められないことは期限付きで持ち帰る。"],

{sk:"社外セミナー登壇・事例発表",vi:"Diễn giả hội thảo, trình bày case study",dom:"saas",
g:["講演の構成と N1：〜を皮切りに・〜にとどまらず","Cấu trúc: tự giới thiệu ngắn → câu hỏi mở cho khán giả → bối cảnh → thử thách → giải pháp → kết quả (số) → bài học. 「〜にとどまらず」 (không chỉ dừng ở…), 「〜を皮切りに」.",["効果は工数削減にとどまらず、社員の働き方にも及びました。","経理部門を皮切りに、全社へと展開いたしました。"]],
s:[["ご{紹介|しょうかい}にあずかりました、グエンと申します。本日はよろしくお願いいたします。","Tôi là Nguyễn, người vừa được giới thiệu. Hôm nay rất mong được quý vị chỉ giáo."],
["まず、会場の皆様に伺います。社内に「Excelの{達人|たつじん}」がいらっしゃる方は、手を挙げていただけますか。","Trước hết tôi xin hỏi quý vị: ai có “cao thủ Excel” trong công ty xin giơ tay?"],
["本日は、ある中堅企業がSaaS導入でつまずき、立ち直るまでの事例をお話しします。","Hôm nay tôi kể câu chuyện một doanh nghiệp vừa vấp ngã khi triển khai SaaS và vực dậy."],
["効果は工数削減にとどまらず、属人化の{解消|かいしょう}にも及びました。","Hiệu quả không chỉ dừng ở giảm công số, mà còn xóa được tình trạng phụ thuộc vào một người."],
["最大の学びは、ツールより先に、業務の{持|も}ち{主|ぬし}を決めることでした。","Bài học lớn nhất là phải xác định người sở hữu nghiệp vụ trước công cụ."],
["ご{清聴|せいちょう}ありがとうございました。","Cảm ơn quý vị đã lắng nghe.","聞いてくれてありがとうございました。"]],
ls:["IT セミナー 登壇 事例発表 SaaS","Xem một bài phát biểu case study bằng tiếng Nhật. Ghi lại câu mở đầu, câu chuyển ý và câu kết."],
rp:["セミナーの司会者と参加者（Claudeが複数役。質問者の一人は競合ベンダー）","事例発表をするBA","IT業界セミナーで15分の事例発表をし、その後質疑応答を受ける。","質疑で参加者が「それはSaaSの選定ミスでは？」と鋭く聞き、競合の人が「御社のツールでないとできないんですか」と誘導する。","聴衆を引き込む話し方をし、意地悪な質問にも品よく答える。"],

{sk:"クレーム後の関係修復",vi:"Hàn gắn quan hệ sau khiếu nại",dom:"log",

g:["保守の範囲の言い方と N1：〜を限りに・〜いかんにかかわらず","Phân biệt: 保守 (sửa lỗi), 運用 (vận hành hằng ngày), 改修 (thay đổi chức năng). SLA: 受付時間, 一次回答時間, 復旧目標. 「本日を限りに」 (kể từ hôm nay chấm dứt), 「理由のいかんにかかわらず」.",["プロジェクト体制は今月末を限りに解散し、保守体制へ移行いたします。","問い合わせ内容のいかんにかかわらず、一次回答は2時間以内といたします。"]],

{sk:"振り返り（KPT）の司会",vi:"Dẫn buổi rút kinh nghiệm dự án (KPT)",dom:"mfg",
g:["責めない振り返りと N1：〜にもまして・〜べくして","KPT: Keep (giữ), Problem (vấn đề), Try (thử). Nguyên tắc: nhìn vào cơ chế, không nhìn vào người. 「起こるべくして起きた」 (xảy ra là tất yếu), 「何にもまして」 (hơn tất cả).",["今回の遅延は、仕組み上起こるべくして起きたものだと思います。","何にもまして、早期の情報共有が効果的でした。"]],
s:[["本日は個人の責任を問う場ではなく、次に活かすための場です。","Hôm nay không phải buổi truy cứu trách nhiệm cá nhân, mà là để áp dụng cho lần sau."],
["まずKeep、続けたい良かった点から{挙|あ}げていきましょう。","Trước hết là Keep, hãy nêu những điểm tốt muốn tiếp tục."],
["今回の{手戻|てもど}りは、仕組み上、起こるべくして起きたのではないでしょうか。","Phần làm lại lần này, xét về cơ chế, chẳng phải là tất yếu xảy ra sao."],
["{犯人探|はんにんさが}しではなく、どこで{気付|きづ}けたかを考えてみましょう。","Không phải đi tìm thủ phạm, hãy nghĩ xem lẽ ra có thể nhận ra ở đâu.","誰のミスですか。"],
["Tryは、次の案件で実行できるものに{絞|しぼ}りましょう。","Phần Try, hãy thu gọn vào những việc làm được ở dự án tiếp theo."],
["{担当|たんとう}と期限を決めて、来月の定例で{確認|かくにん}します。","Quyết định người phụ trách và hạn, rồi kiểm tra ở buổi họp định kỳ tháng sau."]],
ls:["KPT 振り返り やり方 ファシリテーション","Nghe về cách làm KPT. Tìm thêm 「プロジェクト 振り返り 失敗から学ぶ」."],

{sk:"オフショア品質問題の説明",vi:"Giải thích vấn đề chất lượng offshore với phía Nhật",dom:"ec",
g:["身内の問題を説明する難しさと N1：〜は否めない・〜とはいえ","Khi phía Việt Nam có lỗi: không bao che, không đổ lỗi cá nhân; trình bày nguyên nhân cơ chế và biện pháp. Đồng thời giải thích hợp lý những gì phía Nhật cần cải thiện (spec mơ hồ).",["弊社側の確認不足であることは否めません。","とはいえ、仕様の曖昧さも一因であったと考えております。"]],

["改善の効果は、次の2スプリントの不具合数でご報告いたします。","Hiệu quả cải thiện tôi sẽ báo bằng số lỗi của 2 sprint tới."]],

["こちらで多くのことを学ばせていただき、心から感謝しております。","Tôi đã học được rất nhiều ở đây và thật lòng biết ơn.","給料が低いので辞めます。"],

["後任は、金融系の案件経験が豊富な鈴木でございます。","Người kế nhiệm là Suzuki, có nhiều kinh nghiệm dự án tài chính."],
["2週間は二人{体制|たいせい}で対応し、引き継ぎに{漏|も}れがないようにいたします。","Trong 2 tuần sẽ có hai người cùng phụ trách để bàn giao không sót."],
["これまでの{経緯|けいい}や、お客様のご要望の背景も含めて、すべて共有しております。","Toàn bộ diễn biến từ trước tới nay và cả bối cảnh mong muốn của quý công ty đã được chia sẻ."],
["突然のご連絡となり、ご心配をおかけして申し訳ございません。","Xin lỗi vì thông báo đột ngột và làm quý công ty lo lắng.","すみません、辞めます。"],
["ご期待に恥じないよう、最後の日まで責任を持って務めます。","Tôi sẽ làm tròn trách nhiệm đến ngày cuối cùng để không phụ kỳ vọng."]],
ls:["担当変更 挨拶 取引先 後任紹介","Nghe cách thông báo đổi người phụ trách với khách hàng."],
rp:["顧客の部長（信頼していた担当の交代に不満）と後任（Claudeが二役）","退任するBA","顧客を訪問して担当交代を伝え、後任を紹介する。","部長が「このタイミングで？リリース直前なのに」と不満を示し、後任に「あなたは前の経緯を本当に分かってるの？」と試すような質問をする。","顧客の不安を受け止め、後任への信頼を橋渡しする。"],

{sk:"総合：炎上案件の立て直し",vi:"Tổng hợp: cứu dự án đang “cháy”",dom:"gov",
g:["信頼回復の話し方と N1：〜と言わざるを得ない","Khi nhận dự án đang cháy: thẳng thắn về hiện trạng (「〜と言わざるを得ません」), không hứa quá (「過度なお約束はいたしませんが」), cam kết minh bạch (週次で包み隠さず). Đây là ngày tổng hợp kỹ năng: báo cáo + đàm phán + giữ thể diện.",["現在のスケジュールは実現困難と言わざるを得ません。","過度なお約束はいたしませんが、約束したことは必ず守ります。"]],
s:[["本日から本プロジェクトのBAを担当いたします、グエンです。現状を正確に把握するところから始めさせてください。","Tôi là Nguyễn, từ hôm nay phụ trách BA của dự án. Cho tôi bắt đầu từ việc nắm chính xác hiện trạng."],
["率直に申し上げて、現在のスケジュールは実現困難と言わざるを得ません。","Nói thẳng, buộc phải nói rằng lịch hiện tại khó thực hiện."],
["標準化の期限は動かせませんので、範囲と体制の両面で見直しをご提案いたします。","Hạn chuẩn hóa không dời được, nên tôi đề xuất xem lại cả phạm vi lẫn nhân sự."],
["来週までに残課題をすべて洗い出し、優先度付きの一覧をご提示します。","Trước tuần sau tôi sẽ liệt kê toàn bộ vấn đề tồn đọng, kèm danh sách có độ ưu tiên."],
["信頼を回復するためにも、週次で進捗を{包|つつ}み{隠|かく}さずご報告いたします。","Để lấy lại niềm tin, hằng tuần tôi sẽ báo cáo tiến độ không che giấu gì."],
["これまでの{経緯|けいい}を踏まえ、過度なお約束はいたしませんが、約束したことは必ず守ります。","Xét những gì đã xảy ra, tôi sẽ không hứa quá, nhưng điều đã hứa thì nhất định giữ."]],
ls:["プロジェクト 炎上 立て直し","Nghe kinh nghiệm cứu dự án cháy. Tìm thêm 「自治体システム標準化 遅れ ニュース」."],
rp:["顧客（市役所の情報政策課長、前任ベンダー担当に強い不信感）","途中から参画した新任BA","システム標準化案件が3か月遅延。前任BAが離任し、初めて課長と面談する。","課長が冒頭から「また担当が変わるんですか。もう信用できません」と言い、途中で「本当に間に合うと言い切れるんですか」「言い切れないなら契約を見直します」と迫る。","不信感を受け止め、現実的な計画と約束で次回の面談につなげる。"],
n1:"言語知識 mini test｜漢字読み 3・文脈 4・言い換え 3・文法形式 5（15分）",n1t:15},

{sk:"面接⑧：業務知識の深掘り",vi:"Phỏng vấn: đào sâu kiến thức nghiệp vụ",dom:"job",
g:["抽象 → 具体の往復と N1：〜にかけては","Người phỏng vấn sẽ hỏi “ngành bạn chưa làm thì sao?”. Trả lời bằng: kiến thức cụ thể ngành đã làm → cách học ngành mới (có thời hạn) → điểm chung có thể chuyển giao. 「〜にかけては」 (về mặt…thì (giỏi)), 「〜をとっても」 (chỉ lấy ví dụ…).",["要件定義にかけては、業界を問わず成果を出せる自信がございます。","給付費の算定一つをとっても、加算の要件が細かく分かれています。"]],
s:[["保育業界の業務システムで難しいのは、制度が自治体ごとに{微妙|びみょう}に異なる点です。","Cái khó của hệ thống nghiệp vụ ngành giữ trẻ là chế độ khác nhau tinh tế theo từng địa phương."],
["例えば給付費の算定一つをとっても、加算の要件が細かく分かれています。","Ví dụ chỉ riêng việc tính trợ cấp thôi, điều kiện các khoản cộng thêm đã chia rất chi tiết."],
["そのため、制度の{差異|さい}をマスタで{吸収|きゅうしゅう}できる設計を重視してきました。","Vì vậy tôi luôn coi trọng thiết kế hấp thụ sự khác biệt về chế độ bằng dữ liệu master."],
["業務知識がない領域でも、最初の2週間で業務フローと用語を徹底的に押さえるようにしています。","Kể cả với lĩnh vực chưa có kiến thức, tôi luôn nắm chắc luồng nghiệp vụ và thuật ngữ trong 2 tuần đầu."],
["金融は未経験ですが、規制と業務の関係を読み解く点は共通していると考えます。","Tôi chưa có kinh nghiệm tài chính, nhưng việc đọc hiểu quan hệ giữa quy định và nghiệp vụ thì có điểm chung.","金融はわかりません。"],
["要件定義にかけては、業界を問わず成果を出せる自信がございます。","Về định nghĩa yêu cầu, tôi tự tin tạo ra kết quả bất kể ngành nào."]],
ls:["BA ビジネスアナリスト 仕事 業務知識","Nghe về công việc BA ở Nhật. Ghi lại cách người nói giới thiệu ngành của họ."],
rp:["面接官（金融系SIerの部長、業務知識重視）","転職希望のBA（金融は未経験）","二次面接。前職の業務知識と、未経験分野への適応力を問われる。","面接官が「保育の話はわかりました。で、うちは銀行です。与信って説明できます？」と突然専門用語で質問し、「入社3か月で何ができるようになりますか」と迫る。","知らないことは正直に、学習計画と転用可能なスキルで答える。"],
n1:"読解 mini test｜中文 2題 6問・主張理解 1題 4問・情報検索 1題 2問・統合 1題 3問（30分）",n1t:30},

{sk:"BJT 形式の模擬",vi:"Làm quen dạng đề BJT",dom:"bjt",
g:["BJT の構成","BJT có 3 phần: 聴解 (場面把握・発言聴解・総合聴解), 聴読解 (状況把握・資料聴読解・総合聴読解), 読解 (語彙・文法・表現読解・総合読解). Điểm 0–800; J1 = 530–599, J1+ = 600+. Đề đánh giá khả năng chọn câu nói phù hợp với 場面 (vai, quan hệ trên–dưới, trong–ngoài), không chỉ nghĩa.",["あいにく本日は先約がございまして、明日の午前でしたら伺えます。","お言葉に甘えて、先に失礼いたします。"]],
s:[["お待たせいたしました。資料はこちらでよろしいでしょうか。","Xin lỗi đã để chờ. Tài liệu là cái này phải không ạ."],
["恐れ入りますが、もう一度日程を伺ってもよろしいでしょうか。","Xin lỗi, cho tôi hỏi lại lịch một lần nữa được không ạ."],
["あいにく本日は{先約|せんやく}がございまして、明日の午前でしたら伺えます。","Rất tiếc hôm nay tôi có hẹn trước, nếu sáng mai thì tôi có thể đến."],
["{行|ゆ}き{届|とど}かない点があり、失礼いたしました。","Có điểm sơ suất, xin thất lễ."],
["お言葉に{甘|あま}えて、先に失礼いたします。","Xin phép nghe theo lời anh, tôi về trước ạ."],
["前向きに検討させていただきます。来週中にお返事いたします。","Chúng tôi sẽ cân nhắc tích cực và trả lời trong tuần sau."]],
ls:["BJT ビジネス日本語能力テスト 例題","Xem trang/video giới thiệu đề mẫu BJT, nghe phần 場面把握. Tập chọn câu nói phù hợp trước khi nghe đáp án."],
rp:["BJTの出題者（毎回違う場面の登場人物を演じる：上司、取引先、同僚、受付）","各場面の会社員","BJTの場面把握・発言聴解・状況把握を模した短い場面を連続で出す。","場面の切り替えを予告なしに行い、同じ依頼でも相手（社内/社外、上/下）を変えて言い方の切り替えを試す。","場面と相手に合わせて、最も適切な一言を即座に言う。"],
rx:"このセッションは BJT 形式です。Part 2 は1つの長い場面ではなく、30秒〜1分の短い場面を約15個連続で出してください（場面説明 → 相手のセリフ → 私の応答）。各場面ごとに、私の応答がBJTの選択肢として最適かどうかを ✏️ で一行評価してください。最後に、BJTスコアの目安（J1/J1+ など）も推定してください。",
n1:"聴解 mini test（voice mode）｜課題 3・ポイント 3・概要 2・即時応答 7（約25分）",n1t:25},

{sk:"面接⑨：ケース面接",vi:"Phỏng vấn dạng case",dom:"job",
g:["ケース面接の型：前提 → 仮説 → 進め方 → 確認","Đừng trả lời ngay. Hỏi lại tiền đề (mục tiêu, ràng buộc), đưa giả thuyết, nói cách tiến hành theo bước, cuối cùng hỏi lại 「前提が異なる点があればご指摘いただけますか」. Thể hiện tư duy BA chứ không phải đáp án đúng.",["まず前提を確認させてください。","前提が異なる点があれば、ご指摘いただけますか。"]],
s:[["まず前提を確認させてください。目的はコスト削減と顧客満足度の向上、どちらが優先でしょうか。","Cho tôi xác nhận tiền đề trước: mục tiêu ưu tiên là giảm chi phí hay tăng mức hài lòng của khách?"],
["仮説として、問題はシステムよりも業務ルールの側にあると考えます。","Giả thuyết của tôi là vấn đề nằm ở quy tắc nghiệp vụ hơn là ở hệ thống."],
["進め方としては、ヒアリング、現状フローの可視化、課題の優先順位付けの3段階で考えます。","Cách tiến hành: 3 bước gồm hearing, trực quan hóa luồng hiện tại, xếp ưu tiên vấn đề."],
["情報が足りない場合は、推測で進めず、期限を決めて確認します。","Nếu thiếu thông tin, tôi không tiến hành theo phỏng đoán mà đặt hạn để xác nhận."],
["もし予算が半分になるなら、効果の大きい上位二つの課題に{絞|しぼ}ります。","Nếu ngân sách giảm một nửa, tôi sẽ thu hẹp vào 2 vấn đề có hiệu quả lớn nhất."],
["以上が私の考えです。前提が異なる点があれば、ご指摘いただけますか。","Đó là suy nghĩ của tôi. Nếu tiền đề có điểm khác, mong anh chỉ ra."]],
ls:["ケース面接 コンサル 進め方","Nghe ví dụ case interview tiếng Nhật. Chú ý cách người trả lời xác nhận tiền đề."],
rp:["面接官（ITコンサル会社のシニアマネージャー）","転職希望のBA","ケース面接：「ある介護事業者で、職員の記録業務に1日2時間かかっている。BAとしてどう進める？」","面接官が途中で「予算は半分になりました」「現場はシステム導入に反対です」「経営者は3か月で結果を出せと言っています」と条件を次々変える。","前提確認・仮説・進め方を構造的に話し、条件変更に柔軟に対応する。"],
n1:"総合 mini test｜語彙 4・文法 4・読解 4・聴解即時応答 3（25分）",n1t:25},

{sk:"模擬面接（フル）",vi:"Phỏng vấn thử hoàn chỉnh",dom:"job",
g:["オンライン面接のマナー（入室〜退室）","Vào phòng sớm 5 phút, kiểm tra âm thanh 「音声は問題なく聞こえておりますでしょうか」. Nhìn camera khi nói, câu trả lời 1 ý chính ~1 phút. Kết: cảm ơn + mong muốn làm việc. Sau buổi: gửi email cảm ơn trong ngày (không bắt buộc nhưng tạo ấn tượng).",["音声は問題なく聞こえておりますでしょうか。","本日はありがとうございました。御社で働きたいという気持ちが、より一層強くなりました。"]],
s:[["本日はお時間をいただき、ありがとうございます。よろしくお願いいたします。","Cảm ơn quý công ty đã dành thời gian hôm nay. Rất mong được chỉ giáo."],
["音声は問題なく聞こえておりますでしょうか。","Âm thanh có nghe rõ không ạ?"],
["職務経歴について、3分ほどでご説明いたします。","Tôi xin trình bày kinh nghiệm làm việc trong khoảng 3 phút."],
["一言で申し上げますと、「日本のお客様と開発現場をつなぐBA」です。","Nói ngắn gọn, tôi là “BA kết nối khách Nhật với đội phát triển”."],
["御社でなければならない理由は、上流から伴走する姿勢と、多様な業界の案件を両立されている点です。","Lý do phải là quý công ty: tinh thần đồng hành từ thượng nguồn và việc làm song song dự án của nhiều ngành."],
["本日はありがとうございました。御社で働きたいという気持ちが、より{一層|いっそう}強くなりました。","Cảm ơn quý công ty hôm nay. Mong muốn được làm việc tại đây của tôi càng mạnh hơn."]],
ls:["模擬面接 転職 オンライン 全編","Xem một buổi phỏng vấn thử trọn vẹn. Shadowing phần mở đầu và phần trả lời 1 phút."],
rp:["面接官（IT企業の事業部長、一次〜最終の質問を網羅）","転職希望のBA","オンライン面接（約30分）を最初の挨拶から最後の逆質問まで通しで行う。","途中で回線トラブルの演出（「すみません、今の部分、聞こえませんでした」）や、想定外の質問（「当社の課題は何だと思いますか」）を入れる。","30分を通して、一貫したストーリーと敬語を保つ。"],
rx:"このセッションは本番形式の模擬面接です。Part 1 は省略し、Part 2 を約25往復（自己紹介 → 経歴 → 転職理由 → 志望動機 → 強み・弱み → STAR → 深掘り・圧迫 → 条件 → 逆質問）にしてください。Part 3 は「面接官の立場から見た私の評価」を面接官として口頭で述べる形に置き換えてください。最後に、合否の見込み（一次通過／最終通過の可能性）も率直に判定してください。",
n1:"読解 mini test｜長文 1題 4問・統合 1題 3問・主張理解 1題 4問・情報検索 1題 4問（35分）",n1t:35},

{sk:"総合：新プロジェクト初日",vi:"Tổng hợp: ngày đầu ở dự án mới",dom:"api",
g:["キックオフでの自己紹介と N1：〜をもって・〜を皮切りに","Ngày đầu: 「本日より本プロジェクトに参画いたしました」, nói vai trò, mục tiêu tuần đầu, và đặt câu hỏi đúng chỗ. Đây là bài tổng hợp trước buổi đánh giá cuối: tự giới thiệu, hearing, xác nhận tiền đề, đề xuất.",["本日をもちまして、本プロジェクトに正式に参画いたします。","現行データの調査を皮切りに、移行計画を固めてまいります。"]],
s:[["本日より本プロジェクトに{参画|さんかく}いたしました、BAのグエンと申します。","Tôi là Nguyễn, BA, tham gia dự án từ hôm nay."],
["まずは現行システムのデータ構造と、移行対象の範囲を{把握|はあく}したいと考えております。","Trước hết tôi muốn nắm cấu trúc dữ liệu của hệ thống hiện hành và phạm vi chuyển đổi."],
["移行元のデータに、重複や不整合がどの程度あるか、把握されていますでしょうか。","Anh/chị có nắm dữ liệu nguồn có bao nhiêu trùng lặp hay không nhất quán không ạ."],
["突合の基準は、件数と金額の合計でよろしいでしょうか。","Tiêu chí đối chiếu là số bản ghi và tổng số tiền, được không ạ."],
["本番切替の前に、最低2回のリハーサルを実施することを提案いたします。","Tôi đề xuất thực hiện ít nhất 2 lần diễn tập trước khi chuyển đổi production."],
["不慣れな点もあるかと存じますが、一日も早く{戦力|せんりょく}になれるよう努めます。","Có thể còn nhiều điểm chưa quen, nhưng tôi sẽ cố gắng sớm trở thành người góp sức."]],
ls:["データ移行 失敗 リハーサル","Nghe về chuyển đổi dữ liệu và các thất bại thường gặp. Tìm thêm 「キックオフ 自己紹介 例」."],
rp:["新しい職場の PM（日本人、40代、歓迎はするが様子見）と顧客の担当者（Claudeが場面に応じて演じ分ける）","転職先に入社したばかりのBA","入社初日、データ移行プロジェクトのキックオフに途中参加。","PMが「さっそくですが、移行のリスクを3つ挙げてください」と振り、顧客担当者は「前のBAさんとは違うやり方なんですか？」と警戒する。","初日らしい謙虚さと、BAとしての存在感を両立させる。"],
n1:"総合模試（ハーフ）｜語彙 4・文法 4・読解 4・聴解 3（30分）",n1t:30}

</script>
<script>
(function(){
LP.bar();
const KEY=LP.key("jp56_v1");
const TASKS=["Mẫu câu","Ngữ pháp / kính ngữ","Nghe + shadowing","Role-play","Đề N1","Sổ tay"];
let S;
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  S=Object.assign({start:(function(){const t=new Date();t.setDate(t.getDate()+(t.getDay()===0?-6:1-t.getDay()));return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")})(),bjt:"J1",jlpt:"tháng 7/2027",rate:"1",theme:"",days:{}},s||{});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dd(n){if(!S.days[n])S.days[n]={t:[0,0,0,0,0,0],rp:"",n1:"",note:"",book:""};return S.days[n]}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const furi=s=>esc(s).replace(/\{([^|}]+)\|([^}]*)\}/g,(m,a,b)=>b?`<ruby>${a}<rt>${b}</rt></ruby>`:a);
const plain=s=>String(s).replace(/\{([^|}]+)\|([^}]*)\}/g,"$1");
const PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';

// ---- dates
function parseD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function dateOf(n){const d=parseD(S.start);d.setDate(d.getDate()+n-1);return d}
const WD=["CN","T2","T3","T4","T5","T6","T7"];
const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
const fmtL=d=>`${WD[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
function todayN(){const t=new Date();t.setHours(0,0,0,0);return Math.round((t-parseD(S.start))/864e5)+1}

// ---- curriculum access
const isSun=n=>n%7===0;
const wk=n=>Math.ceil(n/7);
function info(n){if(isSun(n))return null;const w=wk(n),p=(n-1)%7;return STUDY[(w-1)*6+p]}
function studyDays(w){const a=[];for(let i=1;i<=6;i++)a.push((w-1)*7+i);return a}
function n1Count(n){return isSun(n)?20:15}
function doneCount(n){const d=S.days[n];return d?d.t.filter(Boolean).length:0}

// ---- prompts
function rpBlock(n,it,extra){
  const dm=DOM[it.dom];
  return `あなたは日本のIT企業で働くネイティブの日本人として、私の日本語ビジネス会話の練習相手になってください。
私：${LP.aboutJp()}。目標はBJT ${S.bjt}、JLPT N1（${S.jlpt}）、日本語での転職面接です。初級者向けの配慮や易しい言い換えは不要です。

■ Day ${n}/84（${fmtL(dateOf(n))}）
■ テーマ：${it.sk}
■ ドメイン：${dm.n}
■ 場面：${it.rp[2]}
■ あなたの役（Part 2）：${it.rp[0]}
■ 私の役：${it.rp[1]}
■ 途中で必ず入れる展開：${it.rp[3]}
■ 今日の到達目標：${it.rp[4]}
${extra?"\n"+extra+"\n":""}
【進め方（約20分）】
Part 1 ウォームアップ：このテーマとドメインについて、あなたから質問して2〜3往復やりとりしてください。
Part 2 ロールプレイ本番（約15往復）：まず私の役と状況を1〜2行で示し、あなたから場面を始めてください。最後まで役を崩さないでください。実際の日本の職場と同じスピード・自然さ・言葉遣いで話し、遠慮なく深掘り・反論・プレッシャーをかけてください。私のセリフは書かないでください。解説のために場面を止めないでください。私の発言に誤り・不自然な表現・敬語やビジネスマナーの問題があったときだけ、あなたの返答の最後に「✏️」で始まる短い一行で指摘してください。
Part 3 役割交代（5〜6往復）：役を入れ替え、私が「${it.rp[0]}」、あなたが「${it.rp[1]}」を演じます。お手本になる自然な言い方で話してください。
${it.rx?"\n※特記事項："+it.rx+"\n":""}
【終了後の評価】日本の職場の基準で厳しく、各10点満点で採点してください。
・正確さ／敬語・ビジネスマナー／自然さ／流暢さ／やりとり／課題達成、そして総合点（10点満点）
・誤りの表：私の発言 → 正しい・より自然な言い方 → 理由（理由はベトナム語で）。同じ種類の誤りはまとめてください。
・良かった点を3つ、覚えるべき新しい表現を5つ（難しい語にはふりがな）、明日の重点を1つ。

では、Part 1 から始めてください。`;
}
function weekNotes(w){
  const out=[];
  for(let n=(w-1)*7+1;n<=w*7;n++){const d=S.days[n];if(!d)continue;const t=[d.book,d.note].filter(x=>x&&x.trim()).join(" / ");if(t)out.push(`Day ${n}: ${t.trim()}`)}
  return out.join("\n");
}
function lowestDay(w){
  let best=null,score=99;
  studyDays(w).forEach(n=>{const v=parseFloat((S.days[n]||{}).rp);if(!isNaN(v)&&v<score){score=v;best=n}});
  return best||studyDays(w)[3];
}
function rpPrompt(n){
  if(n===84){
    return `あなたは日本のIT企業の人事・現場マネージャーを兼ねる評価者として、私の日本語ビジネス会話力を総合的に判定してください。
私：${LP.aboutJp()}。12週間の学習を終えたところです。目標はBJT ${S.bjt}、JLPT N1（${S.jlpt}）、日本語での転職面接。

【進め方（約30分）】
1. 短い自己紹介と職務経歴（私）→ あなたが深掘り質問を3つ。
2. 業務場面を4つ、予告なしで連続して出してください：仕様の矛盾指摘（顧客）、障害の第一報（顧客・怒っている）、スコープ交渉（事業部長）、上司への相談。各場面3〜4往復、役を崩さないでください。
3. 面接の圧迫質問を2つ。
途中で解説はせず、問題があった発言のみ「✏️」で一行指摘してください。

【最終評価】
・正確さ／敬語・ビジネスマナー／自然さ／流暢さ／やりとり／課題達成（各10点）＋総合点
・BJTスコア帯の推定（J2/J1/J1+）と根拠、日本語での転職面接に通用するレベルかの率直な判定
・誤りの表（私の発言 → 自然な言い方 → 理由をベトナム語で）、繰り返す癖の上位3つ
・12週間後の私の強み3つ、次のフェーズ（次の3か月）で最優先すべき課題3つと具体的な練習方法

${weekNotes(12)?"参考：今週の私のメモ\n"+weekNotes(12)+"\n\n":""}では、1から始めてください。`;
  }
  if(isSun(n)){
    const w=wk(n),ln=lowestDay(w),it=info(ln),notes=weekNotes(w);
    const extra=`※今日は第${w}週の復習日です。今週いちばん点数が低かった Day ${ln}（${it.sk}）の場面をもう一度行います。設定は同じですが、相手の反応や想定外の展開は前回と変えてください。${notes?"\n今週の私のメモ（よく間違えた点）：\n"+notes+"\nこれらの誤りが再び出たら、特に厳しく ✏️ で指摘してください。":""}`;
    return rpBlock(n,it,extra);
  }
  return rpBlock(n,info(n),"");
}
function n1Kind(s){return /聴解/.test(s)?"listen":/読解|総合模試/.test(s)?"read":"lang"}
function n1Prompt(n){
  const N=n1Count(n);
  let what,topic,extra="";
  if(isSun(n)){
    const w=wk(n),types=studyDays(w).map(d=>info(d).n1.split("｜")[0]).filter((v,i,a)=>a.indexOf(v)===i).join("、");
    what=n===84?`Tổng kết 12 tuần: mô phỏng N1 thu nhỏ gồm 文字・語彙 5, 文法 5, 読解 6 (1 bài trung văn + 1 bài 統合理解), 聴解 4 (qua voice mode, làm sau cùng). Thời gian gợi ý 40 phút.`
      :`Ôn tập tuần ${w}: 20 câu tập trung vào các dạng tôi hay sai trong tuần. Các dạng tuần này: ${types}.`;
    const notes=weekNotes(w);
    if(notes)extra+=`\nGhi chú lỗi của tôi trong tuần (ưu tiên ra câu đúng vào các điểm này):\n${notes}\n`;
    topic="kinh doanh, IT, xã hội Nhật";
  }else{
    const it=info(n);what=it.n1;topic=`${DOM[it.dom].n} (${DOM[it.dom].v}), kinh doanh và IT`;
    const k=n1Kind(it.n1);
    if(k==="read")extra+="\nVới 読解: đưa bài đọc trước, câu hỏi ngay sau mỗi bài; độ dài và độ trừu tượng đúng chuẩn N1 (bài luận, bình luận xã hội, văn bản kinh doanh), không đơn giản hóa.\n";
    if(k==="listen")extra+="\nVới 聴解: tôi sẽ làm qua voice mode. Bạn đọc phần giới thiệu tình huống, câu hỏi, rồi hội thoại/bài nói với tốc độ tự nhiên như đề thật; với 即時応答 thì đọc 3 lựa chọn bằng lời. Mỗi bài chỉ nghe một lần, tôi trả lời bằng số. Không hiện script cho đến khi chấm xong.\n";
    if(it.n1t)extra+=`\nĐây là mini test có bấm giờ: ${it.n1t} phút. Đưa toàn bộ đề cùng lúc; tôi tự bấm giờ và gửi đáp án kèm thời gian đã dùng. Khi chấm, nhận xét cả cách phân bổ thời gian.\n`;
  }
  return `Bạn là giáo viên luyện thi JLPT N1 người Nhật. Hãy soạn đề luyện N1 cho tôi – Day ${n}/84 (${fmtL(dateOf(n))}).

Dạng hôm nay: ${what}
Số câu: ${N}.
Ngữ liệu nên xoay quanh: ${topic}.
${extra}
Yêu cầu:
- Tự soạn theo đúng hình thức và độ khó đề JLPT N1 thật, không chép đề thật. Bắt đầu ngay ở mức N1, có phương án nhiễu hợp lý và các bẫy thường gặp (từ gần nghĩa, cách đọc dễ nhầm, cấu trúc gần giống).
- Nếu có thẻ quiz thì dùng thẻ quiz (trừ phần nghe qua voice mode). Nếu không, đánh số câu để tôi trả lời dạng 1-3, 2-1…
- Sau khi tôi làm xong: chấm x/${N}, giải thích từng câu sai bằng tiếng Việt và chỉ ra bẫy, rồi liệt kê 5–8 từ/ngữ pháp N1 của ngày (cách đọc, nghĩa tiếng Việt, một câu ví dụ).`;
}

// ---- speech
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang))}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(list){
  if(!("speechSynthesis" in window)){toast("Trình duyệt này không hỗ trợ đọc to.");return}
  speechSynthesis.cancel();
  (Array.isArray(list)?list:[list]).forEach(t=>{
    const u=new SpeechSynthesisUtterance(plain(t).replace(/[【】「」『』]/g," "));
    u.lang="ja-JP";u.rate=parseFloat(S.rate)||1;
    const v=voices.find(v=>/Kyoko|Otoya|Google/.test(v.name))||voices[0];if(v)u.voice=v;
    speechSynthesis.speak(u);
  });
  if(!voices.length)toast("Chưa thấy giọng tiếng Nhật trên máy; có thể cần cài giọng ja-JP.");
}

// ---- clipboard & toast
let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg)}
  catch(e){
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(_){}
    ta.remove();toast(ok?msg:"Không copy được. Mở phần xem trước bên dưới và copy thủ công.");
  }
}

// ---- grid
function renderGrid(){
  const cal=$("cal"),tn=todayN();let h="";
  for(let w=1;w<=12;w++){
    h+=`<div class="wk"><b>Tuần ${w}</b><span class="jp">${WEEKS[w-1][0]}</span></div>`;
    for(let p=1;p<=7;p++){
      const n=(w-1)*7+p,it=info(n),dc=doneCount(n);
      const cls=["day"];if(isSun(n))cls.push("sun");if(n===tn)cls.push("today");if(n===cur)cls.push("sel");if(dc===6)cls.push("done");
      const sk=it?it.sk:"復習";const dm=it?DOM[it.dom].n:(n===84?"Đánh giá cuối":"Ôn tập tuần");
      h+=`<button class="${cls.join(" ")}" data-n="${n}" aria-label="Ngày ${n}, ${fmt(dateOf(n))}, ${esc(sk)}${dc===6?", đã xong":dc?`, xong ${dc}/6`:""}"><span class="n">${n}<span class="d">${fmt(dateOf(n))}</span></span><span class="sk">${esc(sk)}</span><span class="dm">${esc(dm)}</span><span class="pg" style="width:${dc/6*100}%"></span></button>`;
    }
  }
  cal.innerHTML=h;
}
$("cal").onclick=e=>{const b=e.target.closest(".day");if(b)go(+b.dataset.n,true)};

// ---- stats
function renderStats(){
  let days=0,rpS=0,rpN=0,c=0,t=0;
  for(let n=1;n<=84;n++){
    if(doneCount(n)===6)days++;
    const d=S.days[n];if(!d)continue;
    const r=parseFloat(d.rp);if(!isNaN(r)){rpS+=r;rpN++}
    const k=parseInt(d.n1,10);if(!isNaN(k)){c+=Math.min(k,n1Count(n));t+=n1Count(n)}
  }
  $("sDays").innerHTML=`${days} <span>/ 84 ngày</span>`;
  $("sBar").style.width=(days/84*100)+"%";
  $("sRp").innerHTML=rpN?`${(rpS/rpN).toFixed(1)} <span>/ 10 · ${rpN} buổi</span>`:"–";
  $("sN1").innerHTML=t?`${Math.round(c/t*100)}% <span>· ${c}/${t} câu</span>`:"–";
  const tn=todayN();
  $("dayLbl").textContent=tn<1?`Ngày đã xong · còn ${1-tn} ngày nữa là bắt đầu`:tn>84?"Ngày đã xong · lộ trình đã kết thúc":`Ngày đã xong · hôm nay là Ngày ${tn}`;
}

// ---- detail
let cur=1,timerInt=null,timerLeft=0;
function sentHTML(s,i){
  const bad=s[2]?`<div class="bad"><em>Người nước ngoài hay nói:</em> <s class="jp">${furi(s[2])}</s></div>`:"";
  return `<div class="sent"><button class="play" data-say="${esc(plain(s[0]))}" aria-label="Đọc to câu ${i+1}">${PLAY}</button><div class="ja">${furi(s[0])}</div><div class="tr">${esc(s[1])}</div>${bad}</div>`;
}
function termsHTML(dom,n){
  const D=DOM[dom];let occ=0;
  for(let k=1;k<n;k++){const it=info(k);if(it&&it.dom===dom)occ++}
  const start=(occ*6)%D.t.length,rows=[];
  for(let i=0;i<6;i++)rows.push(D.t[(start+i)%D.t.length].split("|"));
  return `<div class="scroll"><table class="terms"><caption>Thuật ngữ nghiệp vụ: ${D.n} – ${esc(D.v)}</caption>${rows.map(r=>`<tr><td><button class="play" style="width:28px;height:28px;display:inline-grid;vertical-align:middle;margin-right:8px" data-say="${esc(r[0].replace(/（.*?）/g,""))}" aria-label="Đọc ${esc(r[0])}">${PLAY}</button>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</table></div>`;
}
function head(no,title,sub,n){
  const on=dd(n).t[no-1];
  return `<div class="th"><span class="no">${no}</span><h3>${title}${sub?`<small>${sub}</small>`:""}</h3><label class="chk"><input type="checkbox" data-t="${no-1}" ${on?"checked":""}> Xong</label></div>`;
}
function linkBtns(q){
  const e=encodeURIComponent(q);
  return `<div class="rowbtns"><a class="btn small" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${e}">Tìm trên YouTube</a><a class="btn small" target="_blank" rel="noopener" href="https://www.google.com/search?q=${e}">Tìm trên Google</a><a class="btn small" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(q+" site:nhk.or.jp")}">Tìm trên NHK</a></div><p class="note">Từ khoá: <span class="jp">${esc(q)}</span></p>`;
}
const SHADOW=`<ol class="steps"><li>Nghe 1 lần không nhìn chữ, đoán ý chính.</li><li>Nghe lại, bật phụ đề tiếng Nhật nếu có; dừng ở cụm khó.</li><li>Shadowing trễ nửa nhịp 3 lượt, lượt cuối bắt chước cả ngữ điệu và chỗ ngắt.</li><li>Ghi 2 cụm nghe được mà mình chưa từng tự nói vào sổ tay.</li></ol>`;

function renderDetail(){
  const n=cur,d=dd(n),it=info(n),w=wk(n),date=dateOf(n),tn=todayN();
  const N=n1Count(n);
  let h=`<div class="dh"><div><div class="meta">Ngày ${n}/84 · Tuần ${w}: ${esc(WEEKS[w-1][1])} · ${fmtL(date)}${n===tn?'<span class="pill">Hôm nay</span>':""}</div>`;
  if(it){
    h+=`<h2>${esc(it.sk)}</h2><div class="vi">${esc(it.vi)}</div><span class="dom">${DOM[it.dom].n} · ${esc(DOM[it.dom].v)}</span>`;
  }else{
    h+=`<h2>${n===84?"総合評価":"第"+w+"週の復習"}</h2><div class="vi">${n===84?"Đánh giá trình độ sau 12 tuần":"Ngày ôn tập tuần "+w+": "+esc(WEEKS[w-1][0])}</div>`;
  }
  h+=`</div><div class="nav"><button class="btn small" data-go="${n-1}" ${n<=1?"disabled":""} aria-label="Ngày trước">‹ Ngày ${Math.max(1,n-1)}</button><button class="btn small" data-go="${n+1}" ${n>=84?"disabled":""} aria-label="Ngày sau">Ngày ${Math.min(84,n+1)} ›</button></div></div>`;

  // 1 sentences
  if(it){
    h+=`<section class="task" data-sec="0">${head(1,"Mẫu câu","6 câu · bấm ▶ để nghe rồi nhại theo",n)}
    <div class="rowbtns"><button class="btn small" data-sayall="1">Đọc cả 6 câu</button><span class="note">Tốc độ: ${S.rate==="0.85"?"chậm":S.rate==="1.15"?"nhanh":"bình thường"} (đổi trong Cài đặt)</span></div>
    ${it.s.map(sentHTML).join("")}${termsHTML(it.dom,n)}
    ${it.dom==="job"||/STAR|苦労/.test(it.sk)?'<p class="note">Số liệu và tên công ty trong mẫu câu chỉ là ví dụ; hãy thay bằng kinh nghiệm thật của bạn.</p>':""}</section>`;
  }else{
    h+=`<section class="task wkrev" data-sec="0">${head(1,"Ôn mẫu câu của tuần","36 câu · nghe và nhại lại, đánh dấu câu còn vấp",n)}`;
    studyDays(w).forEach(k=>{const x=info(k);h+=`<div class="wd">Ngày ${k} · <span class="jp">${esc(x.sk)}</span> <button class="btn small" data-sayday="${k}">Đọc 6 câu</button></div>${x.s.map(sentHTML).join("")}`});
    h+=`</section>`;
  }

  // 2 grammar
  if(it){
    h+=`<section class="task gram" data-sec="1">${head(2,"Ngữ pháp N1 · kính ngữ · business manner","",n)}<h4>${furi(it.g[0])}</h4><p>${furi(it.g[1])}</p>${it.g[2].map(x=>`<div class="ex"><button class="play" data-say="${esc(plain(x))}" aria-label="Đọc ví dụ">${PLAY}</button><span class="ja">${furi(x)}</span></div>`).join("")}<p class="note">Tự đặt 2 câu với điểm này theo bối cảnh dự án của bạn, đọc to rồi ghi vào sổ tay.</p></section>`;
  }else{
    h+=`<section class="task gram" data-sec="1">${head(2,"Ôn ngữ pháp của tuần","",n)}${studyDays(w).map(k=>{const x=info(k);return `<p><b class="jp">${furi(x.g[0])}</b><br><span class="ja jp">${furi(x.g[2][0])}</span></p>`}).join("")}<p class="note">Che phần ví dụ, tự nói một câu cho mỗi điểm; điểm nào bí thì đưa vào sổ tay hôm nay.</p></section>`;
  }

  // 3 listening
  if(it){
    h+=`<section class="task" data-sec="2">${head(3,"Nghe + shadowing","15 phút",n)}<p class="hint">${esc(it.ls[1])}</p>${linkBtns(it.ls[0])}${SHADOW}</section>`;
  }else{
    h+=`<section class="task" data-sec="2">${head(3,"Shadowing lại","15 phút",n)}<p class="hint">Chọn lại 1–2 video hay nhất trong tuần và shadowing không nhìn chữ. Hoặc nghe một bản tin NHK mới về kinh tế – IT.</p>${linkBtns(n===84?"ビジネス日本語 面接 上級":"NHK ニュース 経済 IT")}${SHADOW}</section>`;
  }

  // 4 role-play
  const rpText=rpPrompt(n);
  let scene;
  if(n===84)scene=`<div class="scene">Buổi đánh giá tổng hợp ~30 phút: tự giới thiệu, 4 tình huống công việc liên tiếp, 2 câu hỏi phỏng vấn áp lực, rồi chấm điểm, ước lượng mức BJT và kế hoạch giai đoạn 2.</div>`;
  else{
    const src=it||info(lowestDay(w));
    scene=`${it?"":`<p class="note">Làm lại tình huống điểm thấp nhất tuần: Ngày ${lowestDay(w)} (${esc(src.sk)}). Ghi chú và sổ tay của tuần sẽ tự được đưa vào lời mở đầu.</p>`}<div class="scene"><dl><dt>Claude đóng vai</dt><dd>${esc(src.rp[0])}</dd><dt>Bạn đóng vai</dt><dd>${esc(src.rp[1])}</dd><dt>Tình huống</dt><dd>${esc(src.rp[2])}</dd><dt>Biến cố</dt><dd>${esc(src.rp[3])}</dd><dt>Mục tiêu</dt><dd>${esc(src.rp[4])}</dd></dl></div>`;
  }
  h+=`<section class="task" data-sec="3">${head(4,"Role-play kaiwa với Claude",n===84?"30 phút":"20 phút",n)}${scene}
  <div class="rowbtns"><button class="btn primary small" data-copy="rp">Copy lời mở đầu</button><a class="btn small" href="https://claude.ai/new" target="_blank" rel="noopener">Mở chat mới</a></div>
  <details class="prompt"><summary>Xem lời mở đầu</summary><pre>${esc(rpText)}</pre></details>
  <div class="field"><label for="rpIn">Điểm tổng role-play</label><input id="rpIn" type="number" min="0" max="10" step="0.1" inputmode="decimal" value="${esc(d.rp)}"> <span>/ 10</span></div></section>`;

  // 5 N1
  const n1Text=n1Prompt(n),tmin=it?it.n1t:(n===84?40:0);
  h+=`<section class="task" data-sec="4">${head(5,"Luyện đề JLPT N1",N+" câu",n)}<p class="jp" style="margin:0 0 8px">${esc(it?it.n1:(n===84?"総合模試（20問・40分）":"週の復習：よく間違えた形式（20問）"))}</p>
  <div class="rowbtns"><button class="btn primary small" data-copy="n1">Copy đề N1 hôm nay</button>${tmin?`<span class="timer" id="tm">${String(tmin).padStart(2,"0")}:00</span><button class="btn small" id="tmGo" data-min="${tmin}">Bắt đầu bấm giờ</button><button class="btn small" id="tmReset">Đặt lại</button>`:""}</div>
  <details class="prompt"><summary>Xem nội dung sẽ copy</summary><pre>${esc(n1Text)}</pre></details>
  <div class="field"><label for="n1In">Số câu đúng</label><input id="n1In" type="number" min="0" max="${N}" step="1" inputmode="numeric" value="${esc(d.n1)}"> <span>/ ${N}</span></div></section>`;

  // 6 notebook
  h+=`<section class="task" data-sec="5">${head(6,isSun(n)?"Sổ tay: 5 lỗi hay mắc nhất tuần":"Sổ tay: 3 câu mới hoặc lỗi hay mắc","",n)}
  <textarea id="bookIn" placeholder="Ví dụ: おっしゃられる → おっしゃる (kính ngữ kép)">${esc(d.book)}</textarea>
  <label class="note" for="noteIn" style="display:block;margin:14px 0 4px">Ghi chú của ngày</label>
  <textarea id="noteIn" placeholder="Cảm nhận, điểm cần hỏi lại, link video hay…" style="min-height:70px">${esc(d.note)}</textarea></section>`;

  $("detail").innerHTML=h;
  stopTimer();
}

// ---- detail events
$("detail").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.say)speak(t.dataset.say);
  else if(t.dataset.sayall)speak(info(cur).s.map(s=>s[0]));
  else if(t.dataset.sayday)speak(info(+t.dataset.sayday).s.map(s=>s[0]));
  else if(t.dataset.go)go(+t.dataset.go,true);
  else if(t.dataset.copy==="rp")copy(rpPrompt(cur),"Đã copy lời mở đầu. Dán vào một chat mới.");
  else if(t.dataset.copy==="n1")copy(n1Prompt(cur),"Đã copy đề N1. Dán vào một chat mới.");
  else if(t.id==="tmGo")toggleTimer(+t.dataset.min);
  else if(t.id==="tmReset"){stopTimer();const m=$("tmGo");if(m){timerLeft=0;$("tm").textContent=String(m.dataset.min).padStart(2,"0")+":00";$("tm").classList.remove("end")}}
});
$("detail").addEventListener("change",e=>{
  const el=e.target,d=dd(cur);
  if(el.dataset.t!==undefined){d.t[+el.dataset.t]=el.checked?1:0;save();el.closest(".task").classList.toggle("ok",el.checked);renderGrid();renderStats();if(doneCount(cur)===6)toast("Xong Ngày "+cur+". 済！")}
  else if(el.id==="rpIn"){let v=parseFloat(el.value);d.rp=isNaN(v)?"":String(Math.max(0,Math.min(10,v)));el.value=d.rp;save();renderStats()}
  else if(el.id==="n1In"){let v=parseInt(el.value,10);d.n1=isNaN(v)?"":String(Math.max(0,Math.min(n1Count(cur),v)));el.value=d.n1;save();renderStats()}
});
$("detail").addEventListener("input",e=>{
  const el=e.target,d=dd(cur);
  if(el.id==="bookIn"){d.book=el.value;save()}
  if(el.id==="noteIn"){d.note=el.value;save()}
});
function markOk(){document.querySelectorAll(".task").forEach(s=>{const c=s.querySelector("input[type=checkbox]");if(c)s.classList.toggle("ok",c.checked)})}

// ---- timer
function stopTimer(){clearInterval(timerInt);timerInt=null;const b=$("tmGo");if(b)b.textContent=timerLeft>0?"Tiếp tục":"Bắt đầu bấm giờ"}
function toggleTimer(min){
  if(timerInt){stopTimer();return}
  if(timerLeft<=0)timerLeft=min*60;
  $("tmGo").textContent="Tạm dừng";$("tm").classList.remove("end");
  timerInt=setInterval(()=>{
    timerLeft--;const el=$("tm");if(!el){clearInterval(timerInt);return}
    el.textContent=`${String(Math.floor(timerLeft/60)).padStart(2,"0")}:${String(timerLeft%60).padStart(2,"0")}`;
    if(timerLeft<=0){clearInterval(timerInt);timerInt=null;el.classList.add("end");$("tmGo").textContent="Bắt đầu bấm giờ";toast("Hết giờ! Dừng bút và gửi đáp án.");try{navigator.vibrate&&navigator.vibrate(300)}catch(_){}}
  },1000);
}

// ---- navigation
function go(n,scroll){
  n=Math.max(1,Math.min(84,n));
  if(location.hash!=="#d"+n){history.replaceState(null,"","#d"+n)}
  cur=n;timerLeft=0;renderGrid();renderDetail();markOk();
  if(scroll)$("detail").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function fromHash(){const m=/^#d(\d{1,2})$/.exec(location.hash);return m?+m[1]:null}
window.addEventListener("hashchange",()=>{const h=fromHash();if(h&&h!==cur)go(h,true)});
$("todayBtn").onclick=()=>{const t=todayN();if(t<1)toast("Chưa đến ngày bắt đầu, mở Ngày 1.");go(Math.max(1,Math.min(84,t)),true)};

// ---- theme
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
$("themeBtn").onclick=()=>{
  const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme=dark?"light":"dark";save();applyTheme();
};

// ---- settings
const dlg=$("dlg");
$("setBtn").onclick=()=>{$("fStart").value=S.start;$("fBjt").value=S.bjt;$("fJlpt").value=S.jlpt;$("fRate").value=S.rate;dlg.showModal?dlg.showModal():dlg.setAttribute("open","")};
$("cancelBtn").onclick=()=>dlg.close();
$("saveBtn").onclick=()=>{
  if($("fStart").value)S.start=$("fStart").value;
  S.bjt=$("fBjt").value.trim()||"J1";S.jlpt=$("fJlpt").value.trim()||"tháng 7/2027";S.rate=$("fRate").value;
  save();dlg.close();renderStats();go(cur,false);toast("Đã lưu cài đặt.");
};
$("resetBtn").onclick=()=>{if(confirm("Xoá toàn bộ tiến độ, điểm và ghi chú? Không thể hoàn tác.")){S.days={};save();dlg.close();renderStats();go(cur,false);toast("Đã xoá tiến độ.")}};

// ---- init
load();applyTheme();renderStats();
const h0=fromHash(),t0=todayN();
go(h0||Math.max(1,Math.min(84,t0)),false);
})();

</script>
</body>
</html>
